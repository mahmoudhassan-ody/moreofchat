<!doctype html>
<!--
  `lang` and `dir` are placeholders. i18n/index.ts sets both on the root
  element from the active language before React renders, so the document is
  never briefly laid out in the wrong direction — a flash of LTR in an Arabic
  console is the whole layout jumping on load.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>More Of Chat</title>
    <!--
      No font CDN. IBM Plex Sans Arabic and IBM Plex Mono are in the repository
      and declared in src/theme/faces.css, because the identity is carried by
      the typography and a demo should not lose it to somebody else's uptime.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
