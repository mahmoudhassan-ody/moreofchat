      expected_facts:
        - id: f1
          claim: "a greeting returned to the customer"
          required: true
        - id: f2
          claim: "what the assistant can be asked about"
          required: true
      forbidden_claims:
        - "a list of options presented as readings of the customer's question"
        - "any document title offered as something they might have meant"
        - "any figure at all — nothing was asked"
        - "a request that the customer explain what they meant"
      expected_slots: {}
  gold_chunks: []
  notes: >
    **The first message a real person sent this system**, on 2026-08-25, and
    the first thing a prospect types. It reached the fallback and came back as
    "تقصد أنهي واحدة فيهم؟" over three unrelated office addresses.

    Extraction was never at fault: `مساء الخير` returns `intent=null, slots={}`
    with the language read correctly, 5 of 5, which is exactly what the prompt
    asks for. The fallback then has no missing slot to name, so it offers the
    *retrieved titles* — and retrieval on a greeting returns whatever sat
    nearest in embedding space. Those neighbours were presented to a customer
    as readings of a question they had not asked.

    The option list is right for an ambiguous question and wrong here, which is
    why this is a new `greeting` node rather than a change to the fallback:
    edu-0009 asks `المواعيد إيه؟`, which genuinely has several readings, and
    the titles are the right answer to it. A greeting is not ambiguous. It is
    not a question.

    Filed under `ambiguous` because that is the closest category the schema
    has and inventing one for a single case would be worse. The distinction
    this case actually draws — no-question versus unclear-question — is
    between it and edu-0009, and reading them together is the point.

    **Why no suite caught it:** every case in both files opens with a question.
    That is a property of who wrote them, not of who uses the product.

- id: edu-0020
  vertical: education
  source: real_conversation
  category: factual_retrieval
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "ايه الكليات المتاحة عندكوا"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the faculties the university offers, named"
          required: true
          source_chunk: sinai_faculties_ar
      forbidden_claims:
        - "a list of document titles offered as readings of the question"
        - "a request that the customer say which of several things they meant"
        - "any faculty the corpus does not name"
        - "any fee, threshold or figure — none was asked for"
      expected_slots: {}

    - user: "فرع العريش"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the faculties or programmes available at the Arish branch"
          required: true
          source_chunk: sinai_programs_arish_ar
      forbidden_claims:
        - "the Qantara programme list"
        - "a handoff to a human"
        - "a request that the customer explain what they meant by naming a branch"
      expected_slots:
        branch: arish
  gold_chunks:
    - sinai_faculties_ar
    - sinai_programs_arish_ar
  notes: >
    **The second real conversation, 2026-08-26, and it produced four defects
    at once.** This case pins two of them, because they are one cause.

    Turn 1 is a clear question with no ambiguity in it, answered outright by
    `sinai_faculties_ar`, and it reached the fallback and came back as three
    document titles. Not retrieval and not the prompt: `_intents` builds the
    extractor's list from the intents the script's nodes declare, so a topic
    no node names is a topic the model has no way to return. It returns null,
    and null is the fallback by construction. Six programme chunks — the
    university and each branch, in both languages — had been in the corpus
    since it was written with nothing able to route to them.

    Turn 2 is what the missing node hid. `فرع العريش` carries no intent, so it
    resumes or it falls back, and `resumes()` keys on the slots a node
    declares. Both kinds of declaration gate: `requires_slots` clarifies when
    one is absent, `requires_any_slot` when all are. A branch gates nothing
    here — turn 1 must answer without one — so the node could name the slot
    only by breaking turn 1. `optional_slots` is the third kind, and it exists
    for this shape.

    **The forbidden claim on turn 2 is the handoff.** Every unrouted message
    re-enters the fallback and increments `consecutive_clarifications`; the
    fourth one hands the customer to a human. So in the real conversation a
    customer who answered the bot's own question was escorted off for it, and
    the escalation counter — which is working exactly as designed — is what
    made a routing gap look like a policy.

