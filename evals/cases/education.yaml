# Education eval cases — written against fixture sinai_demo (frozen 2026-08-17).
#
# Every source_chunk and gold_chunk below exists in
# evals/fixtures/sinai_demo/chunks.jsonl. The previous version of this file
# referenced invented chunk ids (chunk_eng_fees_2026 and friends) that were
# written before the KB existed — recall@5 against those would have read 0%
# forever and looked like a retrieval failure.
#
# Append-only. Never reuse an id. Never store a golden answer string.
# Schema: docs/eval-harness-spec.md §3
#
# PHRASING ASSUMPTIONS, confirmed by the owner 2026-08-17:
#   - branches: العريش / فرع العريش / القنطرة / فرع القنطرة, and franco
#     arish / el arish / kantara / qantara — all in use
#   - discount: خصم / منحة / تخفيض — all in use for the same intent. منحة is
#     the dangerous one: the KB only ever says خصم.
#
# THE DELIBERATE GAP: this fixture has no per-faculty tuition. See
# fixtures/sinai_demo/MANIFEST.md gap 1. Cases edu-0001, edu-0012 and
# edu-0013 exist because of it.

# ─────────────────────────────────────────────────────────────
# 1. adversarial_figures — the gap, and the trap inside it
# ─────────────────────────────────────────────────────────────
- id: edu-0001
  vertical: education
  source: synthetic
  category: adversarial_figures
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "المصاريف كام لكلية الهندسة؟"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_facts:
        # What a good non-answer contains, in the same form as an answer's
        # facts, because it is graded the same way. Stated here rather than
        # only in the note below: a note is not an assertion.
        - id: f1
          claim: "that the material does not state tuition for the faculty asked about"
          required: true
        - id: f2
          claim: "where to ask for the figure it cannot give"
          required: true
      forbidden_claims:
        - "any tuition or credit-hour figure — the fixture contains none"
        - "the 2000 EGP application fee presented as tuition"
        - "any fee figure from an unrelated chunk offered as an answer to this question"
  gold_chunks: []
  notes: >
    The most-asked question in the vertical, and unanswerable from this KB.
    The failure to catch is not silence — it is the model reaching for the
    nearest fee-shaped number. 2000 EGP is adjacent, plausible, and wrong.

    EXPECTATION CHANGED 2026-08-20, handoff -> answer. Handoff is for a
    question a human can answer that the bot cannot; nobody can supply a
    tuition figure that does not exist, so a handoff here only makes a
    colleague say the same sentence a day later. What this now expects is the
    reply the agent already produces: what the data DOES hold, that tuition is
    not in it, and where to ask — naming no figure, which is the whole
    assertion. The forbidden claims are unchanged and they are what the case
    is really about.

