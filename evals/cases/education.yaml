# ─────────────────────────────────────────────────────────────
# 4. multi_turn_slots
# ─────────────────────────────────────────────────────────────
- id: edu-0007
  vertical: education
  source: synthetic
  category: multi_turn_slots
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "عايز أعرف الحد الأدنى للقبول"
      expected_action: clarify
      expected_register: masri
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the faculty as something it needs to know"
          required: true
        - id: f2
          claim: "the branch as something it needs to know"
          required: true
        - id: f3
          claim: "the certificate type as something it needs to know"
          required: true
      forbidden_claims:
        - "any threshold figure at all"
      expected_slots: {}
    - user: "العريش"
      expected_action: clarify
      expected_register: masri
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the certificate type as something it still needs to know"
          required: true
        - id: f2
          claim: "the faculty as something it still needs to know"
          required: true
      forbidden_claims:
        - "a threshold figure before the certificate type is known"
      expected_slots: {branch: arish}
    - user: "ثانوية عامة، طب أسنان"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the dentistry threshold for Arish, general secondary"
          required: true
          source_chunk: sinai_admission_thresholds_2026_ar
        - id: f2
          claim: "the year the thresholds apply to"
          required: true
          source_chunk: sinai_admission_thresholds_2026_ar
      forbidden_claims:
        - "the Qantara figure"
        - "the equivalent-certificate figure"
      expected_slots: {branch: arish, certificate: general_secondary, faculty: dentistry}
  gold_chunks: [sinai_admission_thresholds_2026_ar]
  notes: >
    Three slots accumulated over three turns, and turn 3 must hold all
    three simultaneously. f2 is required because this chunk is the one
    place the fixture states a year — the reply must cite it.

