# ─────────────────────────────────────────────────────────────
# 7. code_switching — language mirroring
# ─────────────────────────────────────────────────────────────
- id: edu-0010
  vertical: education
  source: real_conversation
  category: code_switching
  tenant_fixture: sinai_demo
  channel: instagram
  input_lang: mixed
  turns:
    - user: "hi، عايز أعرف الadmission requirements للbusiness"
      expected_action: answer
      expected_register: masri
      expected_lang: ar               # dominant language wins, not first token
      expected_facts:
        - id: f1
          claim: "admission requirements for the business programme"
          required: true
          source_chunk: chunk_admission_business_2026
      forbidden_claims:
        - "requirements for a different faculty"
      expected_slots: {faculty: business}
  gold_chunks: [chunk_admission_business_2026]
  notes: >
    English technical terms may be retained in the reply — that is natural
    Egyptian usage. Replying wholly in English is a language_mirror failure.

# ─────────────────────────────────────────────────────────────
# 8. register_sensitive — MSA for official content
# ─────────────────────────────────────────────────────────────
- id: edu-0011
  vertical: education
  source: real_conversation
  category: register_sensitive
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "ينفع أحول من كلية لكلية تانية بعد سنة؟"
      expected_action: answer
      expected_register: msa          # transfer regulations are official
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the transfer regulation as stated in the KB"
          required: true
          source_chunk: chunk_transfer_rules_2026
        - id: f2
          claim: "credit-hour equivalency handling, if stated"
          required: false
      forbidden_claims:
        - "any transfer condition not present in the KB"
        - "a promise that a transfer will be approved"
  gold_chunks: [chunk_transfer_rules_2026]
  notes: >
    Input is casual Masri, output must be MSA. Tests that register follows
    the script node policy, not the user's input variety.
