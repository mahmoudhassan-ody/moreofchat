- id: edu-0022
  vertical: education
  source: synthetic
  category: ambiguous
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "في أنشطة رياضية في الجامعة؟"
      expected_action: clarify
      expected_register: masri
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "what the assistant can be asked about, named"
          required: true
      forbidden_claims:
        - "any document title offered as a reading of the question"
        - "a claim that the university has or does not have sports activities"
        - "an open request to explain the question again, offering nothing"
        - "any option written in English"
      expected_slots: {}

    - user: "الكليات والتخصصات"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the faculties the university offers, named"
          required: true
          source_chunk: sinai_faculties_ar
      forbidden_claims:
        - "a handoff to a human"
        - "a request that the customer clarify what they meant"
        - "any faculty the corpus does not name"
      expected_slots: {}
  gold_chunks:
    - sinai_faculties_ar
  notes: >
    **The option list had to be pickable and was not.** Turn 1 asks about
    something the corpus genuinely does not cover — there is no sports content
    in the 102 chunks — so a clarification is the right reply, and this case
    says what it must contain: what the assistant can be asked about, not three
    of the corpus's nearest neighbours.

    Turn 2 is the defect. On 2026-08-26 a customer picked one of the three
    titles the fallback had just offered them, `فرع العريش`, and got a handoff.
    A document title is not something the extractor can classify, so choosing
    one returned to the fallback and spent another clarification; the fourth
    consecutive one hands off by design. The bot escorted a customer to a human
    for answering its own question.

    The offers are the script's own node topics now, so every item in turn 1's
    reply routes to the node that named it. Turn 2 picks one, and the handoff
    is a forbidden claim rather than a possibility.

- id: edu-0023
  vertical: education
  source: synthetic
  category: ambiguous
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: english
  turns:
    - user: "Do you have any sports clubs?"
      expected_action: clarify
      expected_register: english
      expected_lang: en
      expected_facts:
        - id: f1
          claim: "what the assistant can be asked about, named"
          required: true
      forbidden_claims:
        - "any option written in Arabic"
        - "any document title offered as a reading of the question"
        - "a claim that the university has or does not have sports clubs"
      expected_slots: {}

    - user: "faculties and programmes"
      expected_action: answer
      expected_register: english
      expected_lang: en
      expected_facts:
        - id: f1
          claim: "the faculties the university offers, named"
          required: true
          source_chunk: sinai_faculties_en
      forbidden_claims:
        - "a handoff to a human"
        - "any reply written in Arabic"
      expected_slots: {}
  gold_chunks:
    - sinai_faculties_en
  notes: >
    edu-0022 in English, and the case for the fourth defect of 2026-08-26:
    `ليه` in an Arabic conversation came back with **English** document titles.

    That was not a missing language filter so much as a missing dedupe. The
    options were the corpus's own titles, and this corpus carries every fact in
    both languages; `titles()` collapsed duplicates on the title *string*, so
    `ما هي كليات جامعة سيناء؟` and `What are the faculties of Sinai
    University?` — one document, two rows — never collapsed, and whichever
    ranked higher was what the customer read. Its own docstring named the
    bilingual pair as the case it handled.

    An `offer:` is authored per language, so there is no wrong one left to
    pick. This case pins it from the other side: an English customer gets
    English topics, and turn 2 picks one of them.
