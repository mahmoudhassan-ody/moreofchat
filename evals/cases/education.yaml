  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: franco
  turns:
    - user: "3ayez a3raf el khasm f far3 el arish"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the Arish branch discount percentage"
          required: true
          source_chunk: sinai_discount_tuition_ar
      forbidden_claims:
        - "the Qantara percentage presented as the Arish one"
      expected_slots: {branch: arish}
