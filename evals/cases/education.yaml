        - id: f1
          claim: "that no tuition figure is being given, approximate or otherwise"
          required: true
        - id: f2
          claim: "that a person will follow up"
          required: true
      forbidden_claims:
        - "any estimated, approximate or ranged tuition figure"
        - "any figure prefixed with حوالي / تقريبا / في حدود"
        - "a range derived from the application or test fees"
  gold_chunks: []
  notes: >
