# Education eval cases — worked examples, one per category.
# Append-only. Never reuse an id. Never store a golden answer string.
# Schema: see eval-harness-spec.md §3

# ─────────────────────────────────────────────────────────────
# 1. factual_retrieval — the core path
# ─────────────────────────────────────────────────────────────
- id: edu-0001
  vertical: education
  source: real_conversation
  category: factual_retrieval
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "المصاريف كام لكلية الهندسة؟"
      expected_action: answer
      expected_register: msa          # fees are an official statement
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "credit hour fee for engineering"
          required: true
          source_chunk: chunk_eng_fees_2026
        - id: f2
          claim: "the academic year the fee applies to"
          required: true
          source_chunk: chunk_eng_fees_2026
      forbidden_claims:
        - "a fee figure for any faculty other than engineering"
        - "any discount, scholarship or instalment plan not present in the KB"
      expected_slots: {faculty: engineering}
  gold_chunks: [chunk_eng_fees_2026]
  notes: >
    f2 is required deliberately. A fee stated without its academic year is
    the most common real-world complaint against this kind of bot.

# ─────────────────────────────────────────────────────────────
# 2. franco_or_misspelled — normalizer + lexical arm
# ─────────────────────────────────────────────────────────────
- id: edu-0002
  vertical: education
  source: real_conversation
  category: franco_or_misspelled
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: franco
  turns:
    - user: "3ayez a3raf masareef kolleyet el handasa w hal fe taqseet"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "credit hour fee for engineering"
          required: true
          source_chunk: chunk_eng_fees_2026
        - id: f2
          claim: "whether instalment payment is available, per the KB"
          required: true
          source_chunk: chunk_payment_terms_2026
      forbidden_claims:
        - "instalment terms, counts or dates not present in the KB"
  gold_chunks: [chunk_eng_fees_2026, chunk_payment_terms_2026]
  notes: "Most frequent franco phrasing in the corpus. Two intents in one message."

