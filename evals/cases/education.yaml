# ─────────────────────────────────────────────────────────────
# 7. register_sensitive
# ─────────────────────────────────────────────────────────────
- id: edu-0011
  vertical: education
  source: synthetic
  category: register_sensitive
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "ينفع أحول من كلية لكلية تانية وأحتفظ بالخصم؟"
      expected_action: answer
      expected_register: msa          # discount rules are official
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the transfer-and-discount rule as stated in the KB"
          required: true
          source_chunk: sinai_discount_faculty_transfer_ar
        - id: f2
          claim: "the track-change fee, if raised"
          required: false
          source_chunk: sinai_fee_track_change_ar
      forbidden_claims:
        - "a promise that a transfer will be approved"
        - "any condition on retaining the discount not in the KB"
  gold_chunks: [sinai_discount_faculty_transfer_ar]
  notes: >
    Casual Masri in, MSA out — register follows the node policy, not the
    input variety. The KB's answer is conditional (non-corresponding
    faculty, same or other branch); flattening it to a plain yes is the
    likeliest failure and the one that creates a false expectation.

