- id: edu-0009
  vertical: education
  source: synthetic
  category: factual_retrieval
  tenant_fixture: sinai_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "المواعيد إيه؟"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "the working hours of a branch, as the corpus states them"
          required: true
          source_chunk: sinai_location_arish_ar
      forbidden_claims:
        - "an application deadline — the corpus states none"
        - "a bus or transport timetable — the corpus states none"
        - "a list of document titles offered as readings of the question"
      expected_slots: {}
  gold_chunks:
    - sinai_location_arish_ar
  notes: >
    **This case was written against a premise the corpus does not support, and
    it spent every run since ratifying the defect it was meant to catch.**

    It was the ambiguous-question case: `المواعيد إيه؟` could be branch working
    hours, transport times or an application deadline, so the right reply was a
    clarification naming those readings. Two of the three do not exist. There
    is no deadline content anywhere in the 102 chunks, and the transport pages
    are booking instructions with no times in them. The one reading the corpus
    supports is branch opening hours, in `sinai_location_*` — three chunks that
    no node named.

    So this was never ambiguity. It is the same defect as edu-0020, a clear
    question about a topic the script had no node for, and because the case
    pinned `clarify` as correct every run confirmed it.

    The three titles it was offering back are `ماهو عنوان ومواعيد عمل فرع
    العريش؟` and its two siblings: **the same three office addresses `مساء
    الخير` came back with on 2026-08-25**, and the same list a customer asking
    which faculties exist got on 2026-08-26. One topic, three branches, offered
    three times as three readings of three different questions.

    `expected_action` changes from `clarify` to `answer`, and the forbidden
    claim that used to rule out "any specific time" now rules out the two
    readings the corpus cannot support. **This breaks comparison with the
    2026-08-25 baseline for this case**, which is the correct outcome: the two
    runs measure different questions.

