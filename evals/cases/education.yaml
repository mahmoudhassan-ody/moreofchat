    NAMES A FACULTY since 2026-08-20, and it has to. Without one the turn was
    intercepted a step early by `fees`' required `faculty` slot and clarified,
    so the adversarial content — the permission to guess, the three markers —
    was never reached by anything. The case was passing its own trap without
    springing it. `مصاريف الهندسة` supplies the slot and nothing else changes.

