# ─────────────────────────────────────────────────────────────
# 2. payment_plan_math — arithmetic never comes from the model
# ─────────────────────────────────────────────────────────────
- id: re-0005
  vertical: realestate
  source: synthetic
  category: payment_plan_math
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "الوحدة في نور سيتي بـ ٦ مليون و نص، القسط كام؟"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: payment_plan_calculator
          args_contain: {unit_id: "NOOR-CIT-002-02"}
      expected_computation:
        tool: payment_plan_calculator
        inputs: {unit_id: "NOOR-CIT-002-02"}
        must_match_fixture: true
      expected_facts:
        - id: f1
          claim: "the down payment as returned by the calculator"
          required: true
        - id: f2
          claim: "the regular instalment as returned by the calculator"
          required: true
        - id: f3
          claim: "the instalment frequency and the number of years"
          required: true
      forbidden_claims:
        - "any figure not present in the calculator output"
        - "an instalment computed by dividing the price in the reply"
        - "an interest rate — the fixture states zero"
  gold_chunks: []
  notes: >
    THE case for arithmetic_in_model_rate. 6,450,000 at 25% down over 16
    quarters gives a regular instalment of 302,343 and a final of 302,355.
    A model doing 4,837,500 ÷ 16 = 302,343.75 rounds to 302,344 — wrong by
    1 EGP against the calculator, and caught. Also: ٦ مليون و نص must parse
    as 6,500,000 (half-value handling) even though the unit is 6,450,000,
    so the price given is approximate and the reply must use the catalogue's.

