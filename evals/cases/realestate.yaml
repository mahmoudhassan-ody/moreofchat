- id: re-0022
  vertical: realestate
  source: synthetic
  category: inventory_lookup
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "عايز استوديو في الساحل الشمالي"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {city: "North Coast", property_type: studio}
      expected_facts:
        - id: f1
          claim: "that no studio is available on the North Coast"
          required: true
        - id: f2
          claim: "a studio that does exist, naming its compound specifically"
          required: true
        - id: f3
          claim: "the price of the named alternative studio"
          required: false
      forbidden_claims:
        - "a chalet offered instead of the studio asked for"
        - "a townhouse or villa offered as a studio"
        - "an apartment offered as a studio"
        - "a compound name not present in the catalogue"
        - "any suggestion that a studio might become available on the coast"
      expected_slots: {property_type: studio, city: "North Coast"}
  gold_chunks: []
  notes: >
    The case the studio units were added for. Cross-type substitution was
    untestable before 2026-08-18: with the catalogue holding one residential
    type, no request could be answered with the wrong one. Now both types have
    real inventory and the rule can actually fail.

    The North Coast holds 33 units — 19 chalets, 11 townhouses, 3 villas — and
    no studio. All 8 studios are inland: New Cairo, New Capital, West Cairo,
    Sheikh Zayed, Mostakbal City. So the coast is chalet-heavy and a chalet is
    the closest thing by every ranking a naive retriever applies, which is
    exactly why a chalet is the forbidden answer rather than a merely
    imperfect one. re-0002 is the same rule with a villa request; this is the
    version where both sides of the substitution have stock.

    Reply shape follows re-0002's owner decision, adapted to what the customer
    named: they asked about a region, not a compound, so the first half names
    the region and the second half must still name a compound —
    "no studio on the North Coast, we have one in <compound>". A city-level
    alternative would leave the customer with nowhere to go.

- id: re-0024
  vertical: realestate
  source: synthetic
  category: inventory_lookup
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "شقة في نور سيتي في حدود ٦ مليون و نص"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {compound: "Noor City", property_type: apartment, budget_max: 6500000}
      expected_facts:
        - id: f1
          claim: "an available Noor City apartment at or below 6,500,000"
          required: true
        - id: f2
          claim: "its price as listed"
          required: true
      forbidden_claims:
        - "any unit above 6,500,000 presented as a match"
        - "NOOR-CIT-002-01 — sold"
        - "an instalment schedule; the customer asked what is available, not how to pay"
      expected_slots:
        {compound: "Noor City", property_type: apartment, budget_max: 6500000}
  gold_chunks: []
  notes: >
    Added 2026-08-20, the ceiling half of the pair with re-0005 turn 1. The two
    sentences differ by three words — `الوحدة في نور سيتي بـ ٦ مليون و نص`
    against `شقة في نور سيتي في حدود ٦ مليون و نص` — and mean different
    things. `في حدود` is a budget, `بـ` after a definite unit is that unit's
    price, and the customer is naming which row they mean.

    Both directions matter and they fail differently. A ceiling read as an
    identifier quotes one unit when the customer wanted the range; an
    identifier read as a ceiling quotes a 2,930,000 studio to someone asking
    about a 6,450,000 apartment, and the reply looks entirely normal.

    `expected_slots` is compared for equality, so this case fails if
    `near_price` is filled and re-0005 fails if `budget_max` is — neither
    needs a separate assertion for the confusion.

    Noor City holds four rows: a sold 3,900,000 apartment, the 6,450,000
    apartment, a 15,800,000 townhouse and a 2,930,000 studio. Only the
    6,450,000 one is an available apartment inside the ceiling, so the
    availability filter and the type filter both have to hold for this to
    pass.

- id: re-0023
  vertical: realestate
  source: synthetic
  category: inventory_lookup
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "عندكم إيه في سيلان؟"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {compound: "Celian"}
      expected_facts:
        - id: f1
          claim: "a unit that exists in Celian, with its type"
          required: true
        - id: f2
          claim: "its price as listed"
          required: true
      forbidden_claims:
        - "a compound name not present in the catalogue"
        - "a unit in a compound other than the one asked about"
        - "any unit not currently available"
      expected_slots: {compound: "Celian"}
  gold_chunks: []
  notes: >
    Browse, not search. The customer names a compound and no property type,
    which is how most real conversations open — "what have you got in X?"
    before any preference is formed.

    Added 2026-08-19 because the suite had no positive case for it, and the
    absence hid a design error: `inventory_lookup` required a `property_type`
    slot, so every browse question clarified instead of answering. re-0012 and
    re-0014 were failing on it and both were read as extraction misses,
    because neither exists to test browsing and both had other reasons to fail.

    A customer who named no type cannot be substituted against — there is
    nothing to substitute *from* — so the requirement refused legitimate
    questions without enforcing anything. `unresolved_type_rate` now makes the
    un-checkable population visible, which is what the requirement was
    standing in for.

    Celian is deliberately unremarkable: three units, all available, two
    types, no sold or reserved rows. Nothing about availability or
    substitution confounds what this case measures.

- id: re-0025
  vertical: realestate
  source: synthetic
  category: multi_turn_slots
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "عايز شقة في مدينتي"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {compound: "Madinaty", property_type: apartment}
      expected_facts:
        - id: f1
          claim: "an available Madinaty apartment, at the catalogue's price"
          required: true
      forbidden_claims:
        - "a price not present in the catalogue"
      expected_slots: {compound: "Madinaty", property_type: apartment}

    - user: "الوحدة في نور سيتي بـ ٦ مليون و نص، القسط كام؟"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: payment_plan_calculator
          args_contain: {unit_id: "NOOR-CIT-002-02"}
      expected_computation:
        tool: payment_plan_calculator
        inputs: {unit_id: "NOOR-CIT-002-02"}
        must_match_fixture: true
      expected_facts:
        - id: f1
          claim: "the down payment as returned by the calculator"
          required: true
        - id: f2
          claim: "the regular instalment as returned by the calculator"
          required: true
        - id: f3
          claim: "the instalment frequency and the number of years"
          required: true
      forbidden_claims:
        - "anything about a Madinaty unit — the customer has moved off it"
        - "that the unit is cash-only or the project complete — that is Madinaty's"
        - "a price of 5,800,000, which belongs to the unit browsed in turn 1"
        - "any figure not present in the calculator output"
      expected_slots:
        compound: "Noor City"
        property_type: apartment
        near_price: 6500000
  gold_chunks: []
  notes: >
    re-0005 turn 1 is this exact sentence as a FIRST turn, and it passes. The
    only difference here is what precedes it, and that difference is the whole
    case: a customer is allowed to change their mind.

    Found by the demo rehearsal, not by this suite, because every payment-plan
    case was a first turn. The extractor is shown the slots already held and
    told not to contradict them, and it returned `near_price` with no
    `compound` — so the merged state still read Madinaty. Everything below
    extraction was then correct about the wrong unit: MADINATY-001-01 has
    `payment_plan: null` and `project_status: Completed`, so the reply was
    "this unit is cash only, the project is finished, 5,800,000" — fluent,
    grounded, as_of disclosed, every figure traceable to a real row. A reply
    that audits clean and answers a question nobody asked.

    `expected_slots` is the assertion that matters and it is an equality
    check: `property_type` inherits from turn 1 while `compound` is replaced,
    which is exactly the distinction the extractor was getting wrong. The
    forbidden claims name the specific wrong answer rather than the shape of
    one, because the wrong answer here is otherwise indistinguishable from a
    right one.

    Fixed in extraction_v1.md (Task 42b): "a value this message names is a
    value the customer said" replaces "held slots persist unless corrected",
    which had only an explicit negation as its worked example. Writing that
    rule also fixed a second thing the same test caught — `مش التجمع، الشيخ
    زايد` was returning `city` in BOTH `slots` and `clear_slots`, which the
    extractor refuses outright, so the prompt's own worked example was a
    failed turn. Replacing a value is a set, never a clear.
