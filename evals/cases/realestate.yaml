# Real-estate eval cases — written against fixture broker_demo_2026_08_01
# (frozen 2026-08-17, as_of 2026-08-01).
#
# Every unit_id below exists in evals/fixtures/broker_demo_2026_08_01/units.jsonl.
# The previous version referenced invented ids (u_1042 and friends) written
# before the catalogue existed.
#
# Append-only. Never reuse an id. Never store a golden answer string.
# Schema: docs/eval-harness-spec.md §3 and §3.2
#
# THREE CASES COME FROM REAL LOGGED CONVERSATIONS (vocabulary reference §17,
# MM tenant, Aug 2026). Those are tagged source: real_conversation and their
# user text is verbatim — including what looks like a typo. Do not clean it.

# ─────────────────────────────────────────────────────────────
# 1. inventory_lookup
# ─────────────────────────────────────────────────────────────
- id: re-0001
  vertical: realestate
  source: real_conversation
  category: inventory_lookup
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "شقة غرفتين في التجمع الخامس"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {city: "New Cairo", property_type: apartment, bedrooms: 2}
      expected_facts:
        - id: f1
          claim: "matching available 2BR New Cairo apartments, with prices from the catalogue"
          required: true
      forbidden_claims:
        - "any unit whose availability is sold or reserved"
        - "any price not present in the catalogue"
        - "a total count of matches unless it is the actual count"
      expected_slots: {city: "New Cairo", property_type: apartment, bedrooms: 2}

    - user: "طب في فيلا"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {property_type: villa, city: "New Cairo"}
      expected_facts:
        - id: f1
          claim: "that no villa is available, naming the compound asked about"
          required: true
        - id: f2
          claim: "a villa that does exist, naming its compound specifically"
          required: true
        - id: f3
          claim: "the price of the named alternative villa"
          required: false
      forbidden_claims:
        - "a villa in any New Cairo compound — the catalogue has none"
        - "an apartment offered as though it satisfied the villa request"
        - "a townhouse or duplex offered as a villa"
        - "a compound name not present in the catalogue"
        - "any suggestion that a villa might become available"
      expected_slots: {city: "New Cairo", property_type: villa, bedrooms: 2}

    - user: "In any other location"
      expected_action: answer
      expected_register: english
      expected_lang: en
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {property_type: villa}
      expected_facts:
        - id: f1
          claim: "villas in the areas where they exist, per the catalogue"
          required: true
      forbidden_claims:
        - "a location called 'any other location'"
        - "any area not represented in the catalogue"
      expected_slots: {property_type: villa, bedrooms: 2}
  gold_chunks: []
  notes: >
    Verbatim, and one conversation rather than three. It was split into
    re-0001/re-0002/re-0003 and every turn after the first then asserted a
    slot no turn had stated: "طب في فيلا" says only "villa" and inherits
    New Cairo, "In any other location" says neither. Both scored as extraction
    failures for years' worth of runs; re-0003 failed all five of its checks
    at once, which is what a wrong case looks like from the outside.

    Turn 1: three slots in one message, and التجمع الخامس must resolve to
    New Cairo. 39 units match, so the reply must not claim to list them all —
    a fabricated count is a figure like any other.

    Turn 2: the catalogue has 5 villas and NONE in any New Cairo compound.
    OWNER DECISION, confirmed 2026-08-17: reply shape is
      "no villa in <compound asked about> — we have a villa in <compound>"
    Both compounds must be named. Compound-level, not city-level: "no villa
    in New Cairo" is vaguer than the customer's question and reads as a
    brush-off, while naming the compound shows the catalogue was actually
    checked. A compound name is therefore a grounded claim like a price, which
    is why an invented one is a forbidden claim rather than a style note. The
    five villas are in SouthMED, Marassi, Jefaira (North Coast), Makadi
    Heights and El Gouna (Red Sea) — nothing else is a valid alternative.

    NO CROSS-TYPE SUBSTITUTION, as a general rule and not only for villas:
    a chalet request is not answered with a townhouse, an office request not
    with retail. The live TypeScript bot currently violates this — it offered
    an 85sqm apartment here — so this turn is a regression test against
    behaviour that exists in production today.

    Turn 3: the ANYWHERE_ELSE pattern. Drops the city filter while keeping
    property_type, rather than searching for a place named "any other
    location". Also the code-switch: an English turn mid-Arabic conversation
    gets an English reply (F6), and the node's register does not decide that.
- id: re-0004
  vertical: realestate
  source: synthetic
  category: inventory_lookup
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "عندكم استوديو في العاصمة الإدارية؟"
      expected_action: answer
      expected_register: masri
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {city: "New Capital", property_type: studio}
      expected_facts:
        - id: f1
          claim: "that a studio is available in New Capital"
          required: true
        - id: f2
          claim: "the compound of at least one of them, named specifically"
          required: true
        - id: f3
          claim: "the price of a named studio"
          required: false
      forbidden_claims:
        - "an apartment offered as a studio"
        - "any unit with bedrooms greater than 0 presented as a studio"
        - "a compound name not present in the catalogue"
      expected_slots: {property_type: studio, city: "New Capital"}
  gold_chunks: []
  notes: >
    The straightforward half of the studio pair: the type exists, the city has
    it, and the reply is an ordinary inventory answer.

    Rewritten 2026-08-18. It previously asserted `property_type: apartment` for
    this query and forbade presenting a studio at all, because the catalogue
    held none and استوديو collapsed into `apartment`. Both premises are now
    false — the fixture carries 8 studios and `studio` is canonical — so the
    old case asserted the exact behaviour the taxonomy change removed.

    New Capital has exactly two, in Vinci (3,770,000) and Noor City
    (2,930,000), both available and both `bedrooms: 0`. The bedrooms forbidden
    claim is the residue of the old lossy mapping: a filter that still resolves
    استوديو to `apartment` returns 3-bedroom flats here, and they must not be
    presented as studios.

# ─────────────────────────────────────────────────────────────
# 2. payment_plan_math — arithmetic never comes from the model
# ─────────────────────────────────────────────────────────────
- id: re-0005
  vertical: realestate
  source: synthetic
  category: payment_plan_math
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "الوحدة في نور سيتي بـ ٦ مليون و نص، القسط كام؟"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: payment_plan_calculator
          args_contain: {unit_id: "NOOR-CIT-002-02"}
      expected_computation:
        tool: payment_plan_calculator
        inputs: {unit_id: "NOOR-CIT-002-02"}
        must_match_fixture: true
      expected_facts:
        - id: f1
          claim: "the down payment as returned by the calculator"
          required: true
        - id: f2
          claim: "the regular instalment as returned by the calculator"
          required: true
        - id: f3
          claim: "the instalment frequency and the number of years"
          required: true
      forbidden_claims:
        - "any figure not present in the calculator output"
        - "an instalment computed by dividing the price in the reply"
        - "an interest rate — the fixture states zero"
      expected_slots: {compound: "Noor City", near_price: 6500000}

    - user: "و لو زودت المقدم لـ ٤٠٪؟"
      expected_action: handoff
      expected_register: msa
      expected_lang: ar
      expected_facts:
        - id: f1
          claim: "that the plan asked about is not one currently offered"
          required: true
        - id: f2
          claim: "that a colleague will follow up"
          required: true
      forbidden_claims:
        - "a recalculated schedule at 40% down"
        - "any instalment figure for a term the developer does not offer"
        - "any suggestion that terms are negotiable"
  gold_chunks: []
  notes: >
    Turn 1 is THE case for arithmetic_in_model_rate. 6,450,000 at 25% down
    over 16 quarters gives a regular instalment of 302,343 and a final of
    302,355. A model doing 4,837,500 ÷ 16 = 302,343.75 rounds to 302,344 —
    wrong by 1 EGP against the calculator, and caught. Also: ٦ مليون و نص must
    parse as 6,500,000 (half-value handling) even though the unit is
    6,450,000, so the price given is approximate and the reply must use the
    catalogue's.

    `بـ ٦ مليون و نص` is the customer identifying WHICH unit, not a ceiling:
    `near_price`, never `budget_max`. Read as a ceiling it selects the first
    Noor City unit under 6.5M — a 2,930,000 studio — and quotes a correct
    instalment for a unit nobody asked about. re-0024 is the same sentence in
    the other direction, and the pair is the point: `expected_slots` is an
    equality assertion, so each case fails if the other slot is filled.

    Turn 2 was re-0006, a separate case whose own note said "the unit_id slot
    must survive from re-0005" — which it could not, because nothing preceded
    it. It pins no `expected_slots`: the unit is context the previous reply
    produced, not something the customer said, and it is held on
    `ConversationState.quoted_unit_id`. That it survives is asserted in
    tests/evals/test_runner_inventory.py, where the assertion can name the
    field it means. The fixture offers one plan shape per unit, 25% down for this one. A
    customer proposing 40% is proposing terms that do not exist, and the
    calculator would happily compute them. Computing an unoffered plan creates
    an expectation the developer must honour or deny. Handoff.
- id: re-0007
  vertical: realestate
  source: synthetic
  category: payment_plan_math
  grounding_mode: inventory
  inventory_fixture: broker_demo_2026_08_01
  tenant_fixture: broker_demo
  channel: whatsapp
  input_lang: masri
  turns:
    - user: "شقة مدينتي 95 متر، ينفع أقسطها؟"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_asof_disclosure: true
      expected_tool_calls:
        - name: inventory_lookup
          args_contain: {compound: "Madinaty"}
      expected_facts:
        - id: f1
          claim: "that this unit is cash only, because the project is completed"
          required: true
      forbidden_claims:
        - "any instalment schedule for this unit"
        - "any down payment figure"

    - user: "التسليم امتى؟"
      expected_action: answer
      expected_register: msa
      expected_lang: ar
      expected_asof_disclosure: true
      expected_facts:
        - id: f1
          claim: "the delivery date from the catalogue"
          required: true
        - id: f2
          claim: "that it is the developer's stated date, not a guarantee"
          required: false
      forbidden_claims:
        - "a delivery date not in the catalogue"
        - "any assurance the date will be met"
  gold_chunks: []
  notes: >
    Turn 1: MADINATY-001-01 is a Completed project, so cash only in the
    fixture. The failure to catch is inventing a plausible plan because every
    other unit has one — pattern-completion over data.

    Turn 2 was re-0009, a standalone case. "التسليم امتى؟" names no unit and
    there are 305 delivery dates in the catalogue, so it could only ever be
    answered by guessing — the honest single-turn reply is "which unit?", and
    the case expected an answer because it had been written assuming a
    conversation. Case defect #5 of the family that produced re-0002, re-0003
    and re-0006; found 2026-08-20 when the delivery node made the assumption
    visible instead of hiding it behind a handoff.

    It follows turn 1 because turn 1 quotes a unit, which is what
    `ConversationState.quoted_unit_id` then holds. Delivery dates in the
    fixture run to 2030 and off-plan slippage is normal in Egypt, so
    presenting one as certain is a claim about the future the broker cannot
    back — the reply states the developer's schedule as such.

