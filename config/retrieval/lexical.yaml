# Meilisearch and fusion — design §7.4 and §7.5.
#
# This file is where Arabic retrieval is won or lost. The synonym map is the
# single highest-leverage thing in it: edu-0015 asks about a منحة against a
# knowledge base that only ever says خصم, and there is no lexical overlap at
# all between the question and the answer. Without the map every student who
# says منحة gets nothing, and the failure reads as "the bot doesn't know about
# scholarships" rather than as a missing synonym.

version: 1

meilisearch:
  # One shared index per vertical with a tenant filter, plus tenant-scoped
  # search tokens (§7.4). Index-per-tenant multiplies Meilisearch's per-index
  # overhead by the tenant count on a 3.3 GB box, and the token is a stronger
  # boundary than a filter the caller has to remember.
  indexes:
    education: kb_education
    realestate: kb_realestate

  tenant_field: tenant_id
  primary_key: point_id

  # How Meilisearch discards words when no document carries all of them.
  #
  # `last` — the engine default — drops from the END of the query. Masri word
  # order puts the scaffolding first and the selective term last, so the
  # end-first drop keeps exactly the words that select nothing. "ثانوية عامة،
  # طب أسنان" lost its gold chunk from the lexical arm entirely under `last`.
  #
  # `frequency` drops the most common word first, which is the discarding
  # order the query actually wants in either language.
  #
  # Measured over the 10 gold-chunk education cases, both arms live:
  #
  #             fused@5   lexical@5   empty lexical
  #   last        70.0%       70.0%          2 / 12
  #   frequency   90.0%       60.0%          1 / 12
  #   all         60.0%       30.0%          7 / 12
  #
  # `frequency` is chosen on the fused number, which is what
  # `retrieval_recall_at_5` gates. The lexical dip is real and not free: it
  # costs edu-0006 and edu-0011, which fusion only absorbs because the dense
  # arm holds both at rank <= 2. So this trade is also a bet that the dense
  # arm is up — during an embedding outage (§7.3) Meilisearch-only recall is
  # *worse* under `frequency`, 60% against 70%. Recorded here because that is
  # the run where someone will wonder why retrieval got worse than the
  # degraded mode they measured.
  matching_strategy: frequency

  # Both forms are searchable (§7.1). The original carries the tenant's own
  # spelling, the normalized one carries the spelling customers type — a query
  # for القنطره has to reach a chunk written القنطرة.
  #
  # Title first, and the order is the ranking. Meilisearch's `attribute` rule
  # ranks a match in an earlier-listed attribute above one in a later
  # attribute, so with content first a chunk matching only in its title lost
  # to any chunk matching in its body — however incidentally.
  #
  # This corpus is Q&A shaped: the title is the question, the content is the
  # answer. "رسوم التقديم كام؟" was answered with the *refund* chunk, whose
  # body happens to repeat رسوم التقديم, over the chunk titled "ما قيمة رسوم
  # التقديم المبدئي؟" whose body is the bare figure "2000 جنيه مصري". The
  # right chunk was outranked structurally rather than on relevance.
  searchable_attributes:
    - title_normalized
    - title
    - content_normalized
    - content

  # Typo tolerance does real work on Franco-Arab and misspelled Arabic (§7.4).
  # Left on deliberately: turning it off makes exact-match recall look better
  # in a demo and worse for every customer who types quickly.
  typo_tolerance:
    enabled: true
    min_word_size_for_one_typo: 4
    min_word_size_for_two_typos: 8

# Arabic stop words. Function words that appear in nearly every chunk carry no
# discriminative signal and crowd the ranker.
#
# Applied by `lexical.strip_stop_words` before the query is sent, not by
# Meilisearch. The engine normalizes this list on write — ي and ى become ی
# (U+06CC), ك becomes ک — and then matches tokens against it without applying
# that normalization, so every entry below containing one of those letters was
# silently inert until the query-side strip landed. `في` was among them.
#
# Consequence, and the reason these are worth listing at all: the default
# matching strategy drops query words from the END, and Masri puts the filler
# at the START. One unlisted leading filler ANDs the whole query to zero
# results — not a poor ranking, an empty list.
stop_words:
  - 'في'
  - 'من'
  - 'على'
  - 'عن'
  - 'الى'
  - 'إلى'
  - 'هل'
  - 'ما'
  - 'هو'
  - 'هي'
  - 'مع'
  - 'او'
  - 'أو'
  - 'و'
  - 'ال'
  - 'يوجد'
  # Franco fillers. `3ayez`/`a3raf` are "I want" / "to know" — conversational
  # scaffolding with no discriminative value, and left in they crowd out the
  # one or two terms in the message that actually select a chunk. `f` is the
  # franco spelling of في.
  - 'fe'
  - 'fi'
  - 'f'
  - 'el'
  - 'al'
  - '3ayez'
  - '3ayza'
  - 'ayez'
  - 'a3raf'
  - 'aeraf'
  - 'ana'
  - 'is'
  - 'the'

  # Masri conversational scaffolding. The franco spellings `3ayez`/`a3raf`
  # above were added when edu-0005 was fixed; their Arabic equivalents were
  # not, so a customer typing franco got a working lexical arm and a customer
  # typing Arabic got an empty one — the opposite of what a franco-tolerance
  # feature should do.
  #
  # One spelling each: matching is on the normalized form, so `أعرف` covers
  # `اعرف` and `إيه` covers `ايه`.
  - 'عايز'
  - 'عاوز'
  - 'عايزة'
  - 'عاوزة'
  - 'أعرف'
  - 'ينفع'
  - 'قولي'
  - 'إيه'
  - 'اللي'
  - 'كام'
  - 'عشان'
  - 'مش'
  - 'بالظبط'
  - 'تقريبا'

  # Not scaffolding — `أحول` is "I transfer", the content word of edu-0011.
  # It earns its place here only because the corpus writes the same idea as
  # التحويل and نقل قيدهم, so `أحول` matches nothing and can only subtract:
  # listing it took the lexical arm from 60% to 70% on the scored turns.
  # The more durable fix is a synonym أحول -> التحويل, which would let the
  # word contribute instead of merely not harming. Left as a stop word for
  # now because a synonym is a retrieval-quality change wanting its own
  # before-and-after, and because this entry becomes wrong the moment a
  # tenant's corpus does say أحول.
  - 'أحول'

# Bidirectional where the words are genuinely interchangeable in this domain,
# one-way where they are not. Meilisearch treats each entry as "when the query
# contains the key, also match these" — so the direction that matters is
# query -> corpus.
synonyms:
  # THE case. A student asks about a منحة; the KB says خصم and never says
  # منحة. Same thing in this tenant's world, no shared letters.
  'منحة':
    - 'خصم'
    - 'خصومات'
  'منح':
    - 'خصم'
    - 'خصومات'
  'خصم':
    - 'منحة'
    - 'خصومات'

  # Franco-Arab spellings, mapped at the word level. This is the mechanism the
  # plan names, and it is what a synonym map is for: a customer typing latin
  # characters is not making a spelling mistake, they are using the keyboard
  # they have.
  'manh':
    - 'منحة'
    - 'خصم'
  'men7a':
    - 'منحة'
    - 'خصم'
  'khasm':
    - 'خصم'
  'khsm':
    - 'خصم'
  'kantara':
    - 'القنطرة'
    - 'القنطره'
  'qantara':
    - 'القنطرة'
    - 'القنطره'
  # Real vocabulary rather than filler: the corpus says لفرع القنطرة, so a
  # franco `far3` has a chunk to reach.
  'far3':
    - 'فرع'
    - 'فروع'
  'fare3':
    - 'فرع'
    - 'فروع'
  'arish':
    - 'العريش'
  '3arish':
    - 'العريش'
  'sakan':
    - 'السكن'
  'masarif':
    - 'المصروفات'
  'masareef':
    - 'المصروفات'

fusion:
  # §7.5: reciprocal rank fusion over the top 20 from each arm, then rerank to
  # top 5.
  candidates_per_arm: 20
  final_k: 5

  # RRF's smoothing constant. 60 is the value from the original paper and the
  # one every published comparison uses; changing it without a measurement is
  # changing the ranking for no reason anyone can defend later.
  rrf_k: 60

  # §7.5's hard rule stands: a turn retrieval cannot support does not reach
  # answer composition. What changed is what the gate decides on. It closes on
  # *presence* — nothing retrieved, or nothing with text to ground on — rather
  # than on similarity, because similarity was measured and does not separate.
  #
  # Top fused hit's cosine across all 17 education cases:
  #
  #   must ANSWER  (10 cases)   0.218 - 0.610   median 0.491
  #   must NOT     ( 7 cases)   0.280 - 0.779   median 0.413
  #
  #   threshold   gold opened   no-gold closed
  #        0.20        10/10              0/7
  #        0.35         6/10              2/7
  #        0.45         5/10              6/7
  #        0.55         4/10              6/7   <- the old value
  #
  # The populations overlap the wrong way round. The most similar result in
  # the suite, 0.779, is edu-0008 which must clarify; the least similar, 0.218,
  # is edu-0015 retrieving exactly the right chunk — منحة against a corpus that
  # only says خصم, where the synonym map does the work and cosine cannot see
  # it. The old 0.55 would have refused six of the ten cases that must answer,
  # including the acceptance case.
  #
  # Kept as a value rather than deleted: a tenant whose corpus does separate
  # cleanly should be able to raise it without a deploy. Do not raise it here
  # without re-running the table above.
  min_score: 0.0

  latency:
    # Fusion sits inside §2.5's turn budget alongside the model call, which
    # already measures 2.7-5.0s. Recorded from the first test rather than
    # discovered at the end.
    target_ms: 300
    # Breakage detector, not a target. Past this something is wrong — a
    # missing payload index, an arm timing out — rather than merely slow.
    ceiling_ms: 3000
