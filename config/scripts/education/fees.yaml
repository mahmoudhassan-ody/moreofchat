# Education fees flow — worked example (design §3.1, §5).
#
# The script owns the flow and the facts. The LLM extracts slots and phrases
# the reply; it never decides what is true about a fee. Every node here states
# an action and a register, so neither is inferred at runtime.
#
# **Immutable once published.** A conversation pins `version` (design §5), so
# editing this file in place would silently change flows mid-thread. To change
# behaviour, publish a new version; in-flight conversations finish on the one
# they started.
#
# Register is node policy, never mirrored from the customer. edu-0011 is the
# case: casual Masri input asking about transfer regulations must produce MSA,
# because the regulation is an official statement.

version: 1
script_id: education_fees
entry: fallback

settings:
  # Overridable per script. The confidence threshold is deliberately NOT
  # settable here — see the note in agent/defaults.yaml and §19.3.
  max_consecutive_clarifications: 3

# What each slot may hold, injected into the extraction prompt at render time
# (§19). Written here rather than in the prompt text: a value the model can
# emit and the script cannot route on is a slot that silently narrows nothing,
# and the model has no way to discover that. Keeping the list in config also
# means adding a faculty is a config edit that moves config_hash, rather than
# a prompt edit that invalidates every baseline.
#
# `free` marks a slot with no closed vocabulary — the model returns what the
# customer said and the downstream resolver decides.
slots:
  faculty:
    values:
      - dentistry
      - pharmacy
      - engineering
      - business
      - mass_communication
      - information_systems
      - physiotherapy
      - biotechnology
  branch:
    values: [arish, qantara]
  student_status:
    values: [egyptian, international]

  certificate:
    values: [general_secondary, azhari, arab_equivalent, foreign_equivalent]

nodes:
  # Core path. edu-0001, edu-0002, edu-0004.
  fees:
    intents: [fees, tuition, credit_hour_fee]
    describe: >
      tuition and credit-hour cost for a named faculty. المصاريف، مصروفات الساعة.
    action: answer
    register: msa          # a fee is an official statement
    requires_slots: [faculty]
    grounding: required
    clarify:
      register: masri      # asking which faculty is conversation, not regulation
      ask_for_slot: faculty

  # edu-0004 turn 3. Inherits faculty from the fees node rather than asking again.
  instalments:
    intents: [instalments, payment_plan]
    describe: >
      paying tuition in stages. أقساط، تقسيط.
    action: answer
    register: msa
    requires_slots: [faculty]
    grounding: required
    clarify:
      register: masri
      ask_for_slot: faculty

  # edu-0011. No slot needed; the regulation is the same for every faculty.
  transfer_rules:
    intents: [transfer_rules, faculty_transfer]
    describe: >
      moving between faculties and what happens to a discount. تحويل من كلية لكلية.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0002. Separate from `fees` because the application fee is one figure
  # for the whole university — requiring a faculty made "رسوم التقديم كام؟"
  # clarify against a chunk that answers it outright.
  application_fee:
    intents: [application_fee, admission_fee]
    describe: >
      the one-off fee paid when applying, not tuition. رسوم التقديم.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0003, edu-0005, edu-0013, edu-0015. The fixture's discount page is the
  # most-asked topic in the suite and had no node, so every one of these fell
  # to the fallback and clarified against a corpus that could answer them.
  #
  # MSA: a discount percentage is an official statement, same reasoning as the
  # fees node. edu-0013 pins masri, and it is the one adversarial case here —
  # register is node policy (§8.2) rather than mirrored, so one topic gets one
  # register and the judge grades the mismatch rather than the engine
  # inventing a second discount node to satisfy it.
  discounts:
    intents: [discounts, scholarships, financial_aid]
    describe: >
      any reduction on tuition — discount, scholarship, grant. خصم، منحة، منح. Franco: khasm, khsm, manh, men7a.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0014. No slot: accreditation is a property of the university, not of a
  # faculty or a branch.
  accreditation:
    intents: [accreditation, recognition]
    describe: >
      whether the university or a degree is recognised. معتمدة، اعتماد.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0006. Masri: whether there is student housing is conversation, not
  # regulation.
  housing:
    intents: [housing, accommodation, dorms]
    describe: >
      student accommodation, dorms, whether housing exists at a branch. السكن الجامعي. Franco: sakan.
    action: answer
    register: masri
    requires_slots: []
    grounding: required

  # edu-0010. How to apply is a procedure the KB states; the branch does not
  # change it.
  application_methods:
    intents: [application_methods, how_to_apply]
    describe: >
      how to apply and through which channel. طرق التقديم، إزاي أقدم.
    action: answer
    register: masri
    requires_slots: []
    grounding: required

  # edu-0004 and edu-0007, and the reason this node has three required slots.
  #
  # The thresholds chunk holds four numbers per faculty — two branches by two
  # certificate types — so answering with one of them before all three are
  # known is a coin flip presented as a fact. edu-0004 names only the faculty
  # and must clarify; edu-0007 accumulates branch, then certificate and
  # faculty, and answers on the third turn.
  admission_thresholds:
    intents: [admission_thresholds, minimum_grade, acceptance_score]
    describe: >
      the minimum grade required for a faculty. الحد الأدنى للقبول، مجموع.
    action: answer
    register: msa
    requires_slots: [branch, certificate, faculty]
    grounding: required
    clarify:
      register: masri
      ask_for_slot: branch

  # edu-0017: "which faculty gets me a job fastest?". Refuse rather than hand
  # off — a colleague cannot answer it either, and the KB states no
  # employment outcomes, so every number would be invented. Refusing names
  # what is knowable instead.
  # edu-0008. Two chunks answer this — Egyptian and international — with
  # different content, so the turn must ask which before choosing. It used to
  # reach the fallback and clarify generically, and the judge failed it on
  # exactly that: "ولم يحدد المعلومة الحاسمة المطلوبة، وهي ما إذا كان الطالب
  # مصريًا أم دوليًا". The decisive question is a slot, so the engine can name
  # it.
  documents:
    intents: [documents, required_papers, admission_documents]
    describe: >
      which papers are needed to apply. الأوراق المطلوبة، المستندات، الورق اللي محتاجه.
    action: answer
    register: msa
    requires_slots: [student_status]
    grounding: required
    clarify:
      register: masri
      ask_for_slot: student_status

  career_advice:
    intents: [career_advice, job_prospects, best_faculty]
    describe: >
      which faculty leads to a job, employment prospects, what to study. Asking us to advise, not to state a fact.
    action: refuse
    register: masri

  # edu-0008. Sensitive and consequential: a human answers, even though the KB
  # has a partial accessibility page.
  accessibility:
    intents: [accessibility, disability_support]
    describe: >
      disability support and accommodations. إعاقة، احتياجات خاصة.
    action: handoff
    register: msa

  # edu-0009's shape: ask which of several meanings, never guess. Reached by
  # any unrecognised intent, so an unknown message is a clarification rather
  # than an exception on the worker.
  fallback:
    action: clarify
    register: masri
