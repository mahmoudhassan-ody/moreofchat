# Education fees flow — worked example (design §3.1, §5).
#
# The script owns the flow and the facts. The LLM extracts slots and phrases
# the reply; it never decides what is true about a fee. Every node here states
# an action and a register, so neither is inferred at runtime.
#
# **Immutable once published.** A conversation pins `version` (design §5), so
# editing this file in place would silently change flows mid-thread. To change
# behaviour, publish a new version; in-flight conversations finish on the one
# they started.
#
# Register is node policy, never mirrored from the customer. edu-0011 is the
# case: casual Masri input asking about transfer regulations must produce MSA,
# because the regulation is an official statement.

version: 1
script_id: education_fees
entry: fallback

settings:
  # Overridable per script. The confidence threshold is deliberately NOT
  # settable here — see the note in agent/defaults.yaml and §19.3.
  max_consecutive_clarifications: 3

  # edu-0001. Where a composed reply sends someone it cannot answer.
  #
  # The reply the case caught was truthful and grounded — it said the material
  # holds admission thresholds and not tuition — and it was a dead end. The
  # composition prompt said "say what is missing and stop", which is exactly
  # what it did.
  #
  # A contact route is tenant data, so it is configured and quoted verbatim
  # rather than left to the model: a model asked to name an office will name a
  # plausible one, and a plausible office is the same failure as a plausible
  # fee. Student affairs is the general front door and the corpus lists it
  # (`sinai_contact_oss_ar`); a tenant who routes fee questions elsewhere edits
  # this line.
  referral:
    ar: "للاستفسار عن ده، تقدر تتواصل مع شئون الطلبة في فرعك."
    en: "For that, you can contact the student affairs office at your branch."

# What each slot may hold, injected into the extraction prompt at render time
# (§19). Written here rather than in the prompt text: a value the model can
# emit and the script cannot route on is a slot that silently narrows nothing,
# and the model has no way to discover that. Keeping the list in config also
# means adding a faculty is a config edit that moves config_hash, rather than
# a prompt edit that invalidates every baseline.
#
# `free` marks a slot with no closed vocabulary — the model returns what the
# customer said and the downstream resolver decides.
slots:
  faculty:
    values:
      - dentistry
      - pharmacy
      - engineering
      - business
      - mass_communication
      - information_systems
      - physiotherapy
      - biotechnology
  branch:
    values: [arish, qantara]
  student_status:
    values: [egyptian, international]

  certificate:
    values: [general_secondary, azhari, arab_equivalent, foreign_equivalent]

nodes:
  # Core path. edu-0001, edu-0002, edu-0004.
  fees:
    intents: [fees, tuition, credit_hour_fee]
    offer:
      masri: "مصاريف الدراسة"
      msa: "المصروفات الدراسية"
      english: "tuition fees"
    describe: >
      tuition and credit-hour cost for a named faculty. المصاريف، مصروفات الساعة.
    action: answer
    register: msa          # a fee is an official statement
    requires_slots: [faculty]
    grounding: required
    clarify:
      register: masri      # asking which faculty is conversation, not regulation
      ask_for_slot: faculty

  # edu-0004 turn 3. Inherits faculty from the fees node rather than asking again.
  instalments:
    intents: [instalments, payment_plan]
    # Not headlined: inside `fees` for a customer — nobody asks about instalments without asking about the fee.
    offer: null
    describe: >
      paying tuition in stages. أقساط، تقسيط.
    action: answer
    register: msa
    requires_slots: [faculty]
    grounding: required
    clarify:
      register: masri
      ask_for_slot: faculty

  # edu-0011. No slot needed; the regulation is the same for every faculty.
  transfer_rules:
    intents: [transfer_rules, faculty_transfer]
    # Not headlined: asked by existing students, and this list is read by prospects.
    offer: null
    describe: >
      moving between faculties and what happens to a discount. تحويل من كلية لكلية.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0002. Separate from `fees` because the application fee is one figure
  # for the whole university — requiring a faculty made "رسوم التقديم كام؟"
  # clarify against a chunk that answers it outright.
  application_fee:
    intents: [application_fee, admission_fee]
    # Not headlined: inside `fees` in the same way; edu-0002 exists because the *node* must be separate, not the offer.
    offer: null
    describe: >
      the one-off fee paid when applying, not tuition. رسوم التقديم.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0003, edu-0005, edu-0013, edu-0015. The fixture's discount page is the
  # most-asked topic in the suite and had no node, so every one of these fell
  # to the fallback and clarified against a corpus that could answer them.
  #
  # MSA: a discount percentage is an official statement, same reasoning as the
  # fees node. edu-0013 pins masri, and it is the one adversarial case here —
  # register is node policy (§8.2) rather than mirrored, so one topic gets one
  # register and the judge grades the mismatch rather than the engine
  # inventing a second discount node to satisfy it.
  discounts:
    intents: [discounts, scholarships, financial_aid]
    offer:
      masri: "الخصومات والمنح"
      msa: "الخصومات والمنح"
      english: "discounts and scholarships"
    describe: >
      any reduction on tuition — discount, scholarship, grant. خصم، منحة، منح. Franco: khasm, khsm, manh, men7a.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0014. No slot: accreditation is a property of the university, not of a
  # faculty or a branch.
  accreditation:
    intents: [accreditation, recognition]
    # Not headlined: asked once a student is choosing between universities, not while browsing.
    offer: null
    describe: >
      whether the university or a degree is recognised. معتمدة، اعتماد.
    action: answer
    register: msa
    requires_slots: []
    grounding: required

  # edu-0006. Masri: whether there is student housing is conversation, not
  # regulation.
  housing:
    intents: [housing, accommodation, dorms]
    offer:
      masri: "السكن الجامعي"
      msa: "السكن الجامعي"
      english: "student housing"
    describe: >
      student accommodation, dorms, whether housing exists at a branch. السكن الجامعي. Franco: sakan.
    action: answer
    register: masri
    requires_slots: []
    grounding: required

  # edu-0010. How to apply is a procedure the KB states; the branch does not
  # change it.
  application_methods:
    intents: [application_methods, how_to_apply]
    offer:
      masri: "طرق التقديم"
      msa: "طرق التقديم"
      english: "how to apply"
    describe: >
      how to apply and through which channel. طرق التقديم، إزاي أقدم.
    action: answer
    register: masri
    requires_slots: []
    grounding: required

  # edu-0004 and edu-0007, and the reason this node has three required slots.
  #
  # The thresholds chunk holds four numbers per faculty — two branches by two
  # certificate types — so answering with one of them before all three are
  # known is a coin flip presented as a fact. edu-0004 names only the faculty
  # and must clarify; edu-0007 accumulates branch, then certificate and
  # faculty, and answers on the third turn.
  admission_thresholds:
    intents: [admission_thresholds, minimum_grade, acceptance_score]
    offer:
      masri: "شروط القبول والمجاميع"
      msa: "شروط القبول والحد الأدنى"
      english: "admission requirements"
    describe: >
      the minimum grade required for a faculty. الحد الأدنى للقبول، مجموع.
    action: answer
    register: msa
    requires_slots: [branch, certificate, faculty]
    grounding: required
    clarify:
      register: masri
      ask_for_slot: branch

  # edu-0017: "which faculty gets me a job fastest?". Refuse rather than hand
  # off — a colleague cannot answer it either, and the KB states no
  # employment outcomes, so every number would be invented. Refusing names
  # what is knowable instead.
  # edu-0008. Two chunks answer this — Egyptian and international — with
  # different content, so the turn must ask which before choosing. It used to
  # reach the fallback and clarify generically, and the judge failed it on
  # exactly that: "ولم يحدد المعلومة الحاسمة المطلوبة، وهي ما إذا كان الطالب
  # مصريًا أم دوليًا". The decisive question is a slot, so the engine can name
  # it.
  documents:
    intents: [documents, required_papers, admission_documents]
    offer:
      masri: "الأوراق المطلوبة"
      msa: "الأوراق المطلوبة"
      english: "the documents you need"
    describe: >
      which papers are needed to apply. الأوراق المطلوبة، المستندات، الورق اللي محتاجه.
    action: answer
    register: msa
    requires_slots: [student_status]
    grounding: required
    clarify:
      register: masri
      ask_for_slot: student_status

  career_advice:
    intents: [career_advice, job_prospects, best_faculty]
    describe: >
      which faculty leads to a job, employment prospects, what to study. Asking us to advise, not to state a fact.
    action: refuse
    register: masri

  # edu-0008. Sensitive and consequential: a human answers, even though the KB
  # has a partial accessibility page.
  accessibility:
    intents: [accessibility, disability_support]
    describe: >
      disability support and accommodations. إعاقة، احتياجات خاصة.
    action: handoff
    register: msa

  # edu-0009 is the same defect as `programs`, and it took two real
  # conversations to see it. `المواعيد إيه؟` was described as ambiguous —
  # branch hours, bus times or a deadline — and the fallback's job was to
  # offer those readings. What it actually retrieves from this corpus is the
  # three `locations` chunks: `ماهو عنوان ومواعيد عمل فرع العريش؟` and its
  # two siblings. One topic, three branches, and no node named it.
  #
  # Those are the same three office addresses `مساء الخير` came back with.
  # The option list was never a list of readings; it was an unmapped topic
  # presented as one, which is why picking from it led nowhere.
  #
  # The real ambiguity in `المواعيد إيه؟` is *which branch*, and a branch is a
  # slot — so it narrows rather than gates, exactly like `programs`. Asking
  # about opening hours with no branch named is answerable: all three are.
  locations:
    intents: [locations, opening_hours, address]
    offer:
      masri: "عناوين الفروع ومواعيد العمل"
      msa: "عناوين الفروع ومواعيد العمل"
      english: "branch addresses and opening hours"
    describe: >
      where a branch is and when it is open. العنوان، مواعيد العمل، الفرع فين.
      Not how to apply and not what it costs.
    action: answer
    register: masri
    requires_slots: []
    optional_slots: [branch]
    grounding: required

  # The first message of the second real conversation, on 2026-08-26:
  # `ايه الكليات المتاحة عندكوا` — a clear question with no ambiguity in it,
  # answered outright by `sinai_faculties_ar`, and it fell to the fallback and
  # came back as three document titles.
  #
  # Not a retrieval failure and not a prompt failure. `_intents` builds the
  # extractor's list from the intents these nodes declare, so a topic no node
  # names is a topic the model cannot return: it returns null, and null is the
  # fallback by construction. The corpus has carried six programme chunks —
  # university-wide and one per branch, in both languages — since it was
  # written, and nothing could route to them.
  #
  # masri, with `housing` and `application_methods` rather than with `fees`.
  # A prospective student asking what is on offer is browsing a catalogue, not
  # reading a regulation, and §8.2 makes register the node's policy.
  #
  # `requires_slots: []` on purpose: the university-wide chunk names every
  # faculty, and demanding a branch first would repeat exactly what
  # `application_fee` was split out to stop — clarifying against a chunk that
  # answers the question as asked.
  #
  # `optional_slots` is the third kind of declaration and it gates nothing.
  # It exists so `resumes()` can see that a branch is this node's business:
  # the follow-up `فرع العريش` carries no intent, and without the slot being
  # declared somewhere it lands back on the fallback and burns a clarification.
  programs:
    intents: [programs, faculties, majors]
    offer:
      masri: "الكليات والتخصصات"
      msa: "الكليات والتخصصات"
      english: "faculties and programmes"
    describe: >
      which faculties, programmes or majors exist, at the university or at one
      branch. الكليات، التخصصات، البرامج المتاحة. Not the cost of one and not
      how to get into one.
    action: answer
    register: masri
    requires_slots: []
    optional_slots: [branch]
    grounding: required

  # edu-0009's shape: ask which of several meanings, never guess. Reached by
  # any unrecognised intent, so an unknown message is a clarification rather
  # than an exception on the worker.
  # A greeting, which is not a question and must not be answered like one.
  # `مساء الخير` was the first message a real person sent this system and it
  # reached the fallback, whose option list is the retrieved titles — so the
  # customer was offered three of the corpus's nearest neighbours as readings
  # of a question they had not asked.
  #
  # An intent rather than a keyword list, because that is where every other
  # value in this system comes from: the extractor is offered exactly the
  # intents these nodes declare, so a greeting becomes classifiable by the
  # model that already read the sentence, in whatever language or franco
  # spelling it arrived in. A word list would need `مساء الخير`, `صباحك فل`,
  # `السلام عليكم`, `ezayak` and every variant nobody thought of.
  #
  # `clarify` rather than `answer`: nothing is retrieved and nothing is
  # composed. The reply is scripted, from `clarify_by_node` in agent/replies —
  # a greeting that went to the model would be a fluent sentence with no source
  # and no reason to be trusted.
  #
  # **`describe` is deliberately tight.** The extractor is told to prefer null
  # over the nearest intent, and a loose description here would pull real
  # questions that open politely — "أهلاً، المصاريف كام؟" is a fees question
  # with a greeting on the front, and it must route to fees.
  greeting:
    intents: [greeting]
    describe: >
      a greeting or salutation and NOTHING else — أهلا، السلام عليكم، صباح
      الخير، مساء الخير، hi, hello. Not a message that opens with a greeting
      and then asks something: that is the intent of what it asks.
    action: clarify
    register: masri
    requires_slots: []

  fallback:
    action: clarify
    register: masri
