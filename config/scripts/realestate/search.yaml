# Real-estate search flow — design §3.1, §3.2, §19.3.
#
# The script owns the flow; the inventory connector owns the facts. The LLM
# extracts slots and phrases the reply, and never decides what is available.
#
# **The no-substitution rule is not expressed here.** The wording of a
# no-match reply is config, because a tenant's own people should be able to
# read and edit what their customers are told. The *rule* — that the
# alternative offered is the same property type as the one asked for — lives
# in `verticals/realestate/replies.py`, where it cannot be edited by accident.
#
# The templates below name `{type}` twice on purpose, and a test asserts it.
# A template with one type slot could render "no studio in North Coast, we
# have a chalet in Marassi" and every structural check would still pass — the
# substitution would arrive through the wording rather than the logic.
#
# Immutable once published (§5): a conversation pins `version`, so changing
# behaviour means publishing a new one.

version: 1
script_id: realestate_search
entry: fallback

settings:
  max_consecutive_clarifications: 3

# What each slot may hold. `from` pulls the vocabulary out of a shared config
# file rather than restating it here — the property types are the catalogue's
# own column and the locations are the alias map's canonical values, and a
# second copy of either would drift into a value the connector cannot filter
# on (§19, §19.3).
#
# This is injected into the extraction prompt at render time. A compound named
# only in the prompt is a compound the resolver cannot parse back, and the
# model cannot tell the difference — it would emit a plausible name and every
# downstream filter would return nothing, reading as "no inventory".
slots:
  property_type:
    from: agent/property_types
  # From the tenant's own inventory, not from a config list. `locations.yaml`
  # used to declare both, and it declared ten of the catalogue's ninety-four
  # compounds — so `كريك تاون` was outside what the model could emit and it
  # answered about Jefaira instead. Which column a value sits in is its kind.
  city:
    from: catalogue
    column: city
  compound:
    from: catalogue
    column: compound
  bedrooms:
    type: integer
  budget_max:
    type: integer
  listing_kind:
    values: [sale, rent]
  unit_id:
    free: true

nodes:
  # re-0001, re-0002, re-0021, re-0022, re-0023.
  #
  # No required slot. `property_type` was required here until 2026-08-19, on
  # the reasoning that without one there is no substitution rule to enforce.
  # That reasoning was right and the conclusion was wrong: a customer who
  # named no type cannot be given the wrong one, because there is nothing to
  # substitute *from*. The requirement refused legitimate browse questions —
  # "what have you got in Celian?", which is how most real conversations open
  # — without enforcing anything.
  #
  # What it was standing in for was a measurement, and that now exists:
  # `unresolved_type_rate` counts turns that presented units with no resolved
  # type, so the un-checkable population is visible instead of being refused.
  # re-0023 is the positive case whose absence hid the error.
  inventory_lookup:
    intents: [inventory_lookup, search_units, availability]
    describe: >
      what units are available — by compound, city, type, bedrooms or budget. Browsing counts: "what have you got in X?". عايز شقة، في فيلا، عندكم إيه.
    action: answer
    register: masri          # showing someone what is available is conversation
    requires_slots: []
    grounding: required
    clarify:
      register: masri
      ask_for_slot: property_type

  # re-0005, re-0006, re-0007. MSA: an instalment schedule is an official
  # statement, and the figures come from the calculator rather than the model.
  payment_plan:
    intents: [payment_plan, instalments, calculator]
    describe: >
      instalments, down payment, or whether a specific unit can be paid over time. قسط، تقسيط، مقدم.
    action: answer
    register: msa
    # No required slot, because a customer does not say a unit id. re-0005 is
    # "the unit in Noor City at six and a half million" — which identifies a
    # row without naming one, and resolving that is the connector's job rather
    # than a slot the extractor must somehow fill. A turn whose unit cannot be
    # resolved hands off; it does not guess which unit was meant.
    requires_slots: []
    grounding: required
    clarify:
      register: masri
      ask_for_slot: unit_id

  # re-0013, the highest commercial risk in the suite. Unconditional: the bot
  # has no authority to concede anything, and whatever it concedes the broker
  # must honour or publicly deny. There is no slot that would make this
  # answerable.
  negotiation:
    intents: [negotiation, discount_request, best_price, cash_discount]
    describe: >
      asking for a discount, the best price, or a cash reduction. أقل سعر، خصم، كاش.
    action: handoff
    register: masri

  # re-0015. Every number would be invented, and a projection is also the kind
  # of claim that attracts regulatory attention. Refuse rather than hand off:
  # a colleague cannot answer it either, and passing it along implies someone
  # here will.
  investment_projection:
    intents: [investment_projection, appreciation, resale_value, roi]
    describe: >
      future value, appreciation, or return on investment. هتزيد قيمتها، استثمار.
    action: refuse
    register: masri

  # re-0016's shape. Legal and contractual questions are a human's.
  contracts:
    intents: [contract_terms, legal, ownership_transfer]
    describe: >
      contract terms, ownership transfer, or legal questions. عقد، تمليك.
    action: handoff
    register: msa

  fallback:
    action: clarify
    register: masri

# Customer-facing wording for the outcomes the connector produces. No figure
# appears here — prices come from a row, never from a template.
replies:
  # The requested type exists, just not where the customer asked. Both halves
  # name the SAME type; that is the whole shape of the owner decision of
  # 2026-08-17.
  no_match_same_type:
    masri: "مفيش {type} في {asked_about} دلوقتي. عندنا {type} في {compound} بسعر {price} {currency}. البيانات محدّثة {as_of}."
    msa: "لا يتوفر {type} في {asked_about} حاليًا. يتوفر {type} في {compound} بسعر {price} {currency}. البيانات محدثة بتاريخ {as_of}."
    english: "There's no {type} in {asked_about} right now. We do have a {type} in {compound} at {price} {currency}. Inventory current as of {as_of}."

  # Nothing of that type anywhere in range (re-0021). Deliberately names no
  # compound: there is none to name, and naming one above budget would answer
  # a different question.
  no_match_anywhere:
    masri: "مفيش {type} متاح في النطاق ده دلوقتي. هحوّلك لزميلي يشوفلك الخيارات. البيانات محدّثة {as_of}."
    msa: "لا يتوفر {type} ضمن هذا النطاق حاليًا. سيتم تحويلك إلى أحد الزملاء. البيانات محدثة بتاريخ {as_of}."
    english: "We have no {type} in that range right now. I'm passing you to a colleague. Inventory current as of {as_of}."

  # Units found. The figures are interpolated from the row, never composed —
  # §3.1's rule, and what makes `arithmetic_in_model_rate` checkable.
  units_found:
    masri: "عندنا {type} في {compound} بسعر {price} {currency}. البيانات محدّثة {as_of}."
    msa: "يتوفر {type} في {compound} بسعر {price} {currency}. البيانات محدثة بتاريخ {as_of}."
    english: "We have a {type} in {compound} at {price} {currency}. Inventory current as of {as_of}."

  # re-0007: a completed project is cash only. Says so plainly rather than
  # offering a plan, because every other unit having one makes the shape of an
  # answer available when the facts are not.
  cash_only:
    masri: "الوحدة دي في {compound} كاش بس، المشروع مكتمل. السعر {price} {currency}. البيانات محدّثة {as_of}."
    msa: "هذه الوحدة في {compound} متاحة نقدًا فقط لاكتمال المشروع. السعر {price} {currency}. البيانات محدثة بتاريخ {as_of}."
    english: "This unit in {compound} is cash only — the project is complete. Price {price} {currency}. Inventory current as of {as_of}."

  # re-0005. Every figure comes from the calculator's output, which the gate
  # string-matches the reply against.
  payment_plan:
    masri: "المقدم {down_payment} {currency}، والقسط {installment} {currency} كل ربع سنة على {years} سنين ({count} قسط). البيانات محدّثة {as_of}."
    msa: "الدفعة المقدمة {down_payment} {currency}، والقسط {installment} {currency} على مدى {years} سنوات ({count} قسط). البيانات محدثة بتاريخ {as_of}."
    english: "Down payment {down_payment} {currency}, instalment {installment} {currency} over {years} years ({count} payments). Inventory current as of {as_of}."
