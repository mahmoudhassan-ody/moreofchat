dialect:
  # ar-eg only, by decision 2026-08-17. The source bot also carried ar-gulf,
  # ar-levant and ar-maghreb keyword sets; those are dropped.
  #
  # Consequence, stated plainly: a Gulf or Levantine customer is detected as
  # Arabic and answered in Masri. Acceptable for an Egyptian-market product,
  # and it removes three keyword sets that nothing in the eval suite covers.
  # Re-adding one means adding a register option and cases for it — do not
  # re-add a keyword list without the cases.
  supported:
    - 'ar-eg'
  ar-eg:
    # PARTIAL. The source reference lists 26 words for ar-eg but shows only
    # these 17 as samples. Port the full list from language.ts:27-115 rather
    # than treating this as complete.
    - 'عايز'
    - 'عاوز'
    - 'ايه'
    - 'ايوه'
    - 'ازيك'
    - 'كويس'
    - 'امتى'
