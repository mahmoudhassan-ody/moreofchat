# Extraction vocabulary — inbound message parsing.
#
# Source: the running MoreofChat real-estate bot (extraction.ts:136-145,
# resolve.ts, qualify.ts), transcribed 2026-08-17. This replaces guesses:
# the sections that overlap with the existing config/arabic/lexicon.yaml were
# written from assumption in week-1 Task 8, and these are the real maps from
# production traffic.
#
# ─────────────────────────────────────────────────────────────────────────
# CRITICAL — DO NOT MERGE `price_cap_words` INTO `approximation_markers`
# ─────────────────────────────────────────────────────────────────────────
# They share words (حوالي, تقريبا, في حدود) and mean opposite things
# depending on direction:
#
#   INBOUND, customer:  "شقة حوالي 5 مليون"
#     -> a budget hint. Legitimate, expected, sets maxPrice. Must NOT trip
#        any grounding check — the customer is allowed to be approximate.
#
#   OUTBOUND, bot reply: "السعر حوالي 5 مليون"
#     -> a hedged figure. Trips hedged_figure_rate, a zero-tolerance gate.
#        The bot either knows the price or hands off; it never estimates.
#
# One list serving both breaks one of them. Merge them and either budget
# extraction stops working, or the hedge check fires on every customer who
# says "around" — and the fix people reach for is disabling the check.
# ─────────────────────────────────────────────────────────────────────────

version: 1

price_units:
  # Applied to a preceding number. `م` is included because brokers write ٦ م.
  1000:
    - 'thousand'
    - 'k'
    - 'ألف'
    - 'الف'
  1000000:
    - 'million'
    - 'm'
    - 'مليون'
    - 'ملیون'      # Farsi yeh U+06CC — visually identical, different codepoint
    - 'م'
    - 'melion'

bare_number_threshold: 100000
# A number with no unit word is taken as-is only at or above this. Below it,
# the value is ambiguous ("5" could be 5 million, 5 bedrooms, or a typo) and
# resolution must fail rather than guess. Guessing here misprices a unit by
# six orders of magnitude.

price_cap_words:
  # INBOUND ONLY. Sets maxPrice. See the warning above.
  latin:
    - 'under'
    - 'below'
    - 'less than'
    - 'max'
    - 'maximum'
    - 'up to'
    - 'within'
    - 'around'
    - 'at most'
  arabic:
    - 'أقل من'
    - 'اقل من'
    - 'بحد أقصى'
    - 'بحدود'
    - 'حتى'
    - 'ما يزيدش عن'
    - 'حوالى'
    - 'حوالي'
    - 'في حدود'
    - 'حدود'
    - 'تقريبا'
    - 'تقريباً'
    - 'تقريبًا'

price_min_words:
