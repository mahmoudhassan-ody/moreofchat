# Arabic lexicon — platform tier (design doc §19.1).
#
# Every lexical value used by src/moc/arabic/numerals.py lives here. That module
# contains zero Arabic literals and zero magic numbers by rule (§19.2), and two
# tests in tests/arabic/test_numerals.py fail if either creeps back in.
#
# Path: YAML (P0-P1) -> DB table (P3) -> admin console (P4). Read only through
# moc.config_store, never opened directly, so P3 is a one-module change.
#
# Bump `version` on every edit. The eval suite pins it (§19.4) — a regression
# measured against a different lexicon is not a measurement.

version: 1

# ─────────────────────────────────────────────────────────────
# Digit maps. Each string is positional: index 0 is that script's zero.
# ─────────────────────────────────────────────────────────────
digits:
  latin: "0123456789"
  # U+0660-0669, used across Egypt.
  arabic_indic: "٠١٢٣٤٥٦٧٨٩"
  # U+06F0-06F9, Persian/Urdu keyboards. Visually near-identical to the above,
  # which is exactly why a reply can mix them without anyone noticing.
  extended_arabic_indic: "۰۱۲۳۴۵۶۷۸۹"

separators:
  # A comma is ambiguous: 1,250,000 is grouped, 2,5 is decimal. The algorithm
  # disambiguates by group width; both spellings are listed in both places.
  thousands:
    - ","
    - "٬"      # U+066C arabic thousands separator
    - " "      # thin space grouping, seen in pasted spreadsheet values
  decimal:
    - "."
    - ","
    - "٫"      # U+066B arabic decimal separator
  # Digits per group in a thousands-separated number: 1,250,000.
  group_size: 3

# Shaved off a token before it is matched. Separators are excluded automatically,
# so a trailing "." here never eats a decimal point.
#
# `*_`|~` were added on 2026-08-20 and they are not cosmetic. A model that
# formats — and one did, every time, because there was no composition prompt —
# writes `**3000**`, and a figure with an asterisk welded to it did not match
# the number pattern at all. It was therefore not a figure, so
# `hallucinated_figure_rate` read 0.0% while a wrong fee went out. The same
# sentence without the asterisks was caught correctly, which is why nothing
# looked broken.
punctuation:
  trim: "،؛,.;:!؟?()[]«»\"'*_`|~"

  # Digits that number a list rather than state an amount. `1.` and `2)` at
  # the start of a line are structure — edu-0010 answered "three ways to
  # apply" as a numbered list and the gate read one, two and three as three
  # ungrounded figures, discarding a correct and fully-grounded reply.
  #
  # Only at the start of a line, only these characters, and only a short
  # run of digits: `1400.` opening a line is a fee, not the one-thousand-four-
  # hundredth item.
  #
  # `-` added 2026-08-26, from a sweep of every bare figure in the corpus. The
  # dorm-booking instructions are written `1- تحديد نوع الغرفه`, four items,
  # and they were four ungrounded figures waiting for a customer to ask —
  # edu-0010's failure again, in punctuation nobody had listed. Safe for the
  # same two reasons the others are: line-initial only, and `list_marker_max_
  # digits` keeps a range like `1400- 1500` out.
  list_markers: ".)-"
  list_marker_max_digits: 2

  # Leading characters a formatter puts before the marker. Skipped over when
  # looking for one, never treated as content.
  line_prefixes: "#*->•—–\t "

# ─────────────────────────────────────────────────────────────
# Unit multipliers. Latin entries match case-insensitively.
# ─────────────────────────────────────────────────────────────
unit_multipliers:
  - multiplier: 1000
    words:
      - "ألف"
      - "الف"
      - "آلاف"
      - "الاف"
      - "k"
  - multiplier: 1000000
    words:
      - "مليون"
      # Same word spelled with Farsi yeh U+06CC instead of Arabic yeh U+064A.
      # Common from non-Egyptian keyboards; a distinct string, so listed twice.
      - "ملیون"
      - "ملايين"
      - "melion"
      - "million"
      - "m"
      - "م"
  - multiplier: 1000000000
    words:
      - "مليار"
      - "billion"
      - "b"

# Spoken fractions: "٥ و نص مليون" is 5.5 million, not 5 million.
fractions:
  "نص": 0.5
  "نصف": 0.5
  "ربع": 0.25
  "تلت": 0.75      # "و تلت" after a whole reads as three-quarters in this phrasing
  half: 0.5

conjunctions:
  - "و"
  - and

# ─────────────────────────────────────────────────────────────
# Rejection vocabulary — tokens that mean a nearby digit is not a quantity.
# ─────────────────────────────────────────────────────────────

# Ordinals never denote an amount. Egyptian and MSA spellings both appear.
ordinal_markers:
  - "الأول"
  - "الاول"
  - "الأولى"
  - "الاولى"
  - "التاني"
  - "الثاني"
  - "التانية"
  - "الثانية"
  - "التالت"
  - "الثالث"
  - "التالتة"
  - "الثالثة"
  - "الرابع"
  - "الرابعة"
  - "الخامس"
  - "الخامسة"
  - "السادس"
  - "السادسة"
  - "السابع"
  - "السابعة"
  - "التامن"
  - "الثامن"
  - "التاسع"
  - "العاشر"

# A floor is a location. "الدور الخامس" and "الدور 5" are both rejected.
floor_markers:
  - "الدور"
  - "دور"
  - "الطابق"
  - "طابق"

# A form is identified by a number; it does not state an amount. `نموذج 2 جند`
# and `Military Form 6` appear 29 times across the documents chunks, which is a
# topic with a live node — so a customer asking which papers they need would
# have every form number put to a model-backed auditor as a claim, exactly as
# the study durations were on 2026-08-26.
#
# The marker precedes its number, like a floor and a place.
form_markers:
  - "نموذج"
  - "النموذج"
  - "استمارة"
  - "الاستمارة"
  - "استماره"
  - form
  - forms

# Place names that embed a number. "التجمع الخامس" is New Cairo, not five.
place_markers:
  - "التجمع"
  - "تجمع"
  - "المنطقة"
  - "الحي"

# A hedged figure is a hallucination with a disclaimer. Multi-word entries are
# matched across token boundaries.
approximation_markers:
  - "حوالي"
  - "حوالى"
  - "تقريبا"
  - "تقريباً"
  - "في حدود"
  - "في حدود"
  - "نحو"
  - "قرابة"
  - around
  - approximately
  - about
  - roughly
  - circa

# ─────────────────────────────────────────────────────────────
# Tagging vocabulary — what a nearby digit is *about*.
# ─────────────────────────────────────────────────────────────
# Multi-word entries are allowed and are matched longest-first. The corpus
# writes `1000 Egyptian Pounds`, where the token touching the figure is an
# adjective — so a single-token lookahead read it as bare, and a bare
# four-digit number inside 1900-2100 is suppressed as a date. `The fee is 2000
# Egyptian Pounds` extracted no figures at all, which put a fee in a
# two-hundred-wide window past both zero-tolerance gates. Found 2026-08-26 by
# sweeping every bare figure in the corpus, not by anyone reading this list.
currency_markers:
  - "egyptian pounds"
  - "egyptian pound"
  - pounds
  - pound
  - "جنيه"
  - "جنيها"
  - "جنيهاً"
  - "ج.م"
  - "جم"
  - EGP
  - LE
  - L.E

percent_markers:
  - "٪"
  - "%"
  - "بالمية"
  - "بالمئة"
  - "في المية"
  - percent

count_markers:
  - "غرف"
  - "غرفة"
  - "غرفه"
  - "أوضة"
  - "اوضة"
  - "اوض"
  - "حجرة"
  - bedrooms
  - bedroom
  - rooms

# A span of time, not an amount. `مدة الدراسة 5 سنين` is eight figures in a
# faculty list, and on 2026-08-26 they cost a customer their answer: every one
# traced to the corpus and the deterministic gate passed, but they are figures,
# so §19.3's claim auditor was called — and it returned one of the eight with
# no span. `_supported` fails closed on a missing span and the reply was
# discarded, with a scripted apology about "الرقم ده" to someone who had asked
# which faculties exist.
#
# The figure gates are for money. §3.1: the LLM never composes a fee, a price
# or a payment figure. A count of years is none of those.
#
# **Nouns for a span only.** `شهريا` and `سنويا` say how often, not how long —
# `القسط 5000 شهريا` is a payment figure and must stay auditable — so the
# adverbs are deliberately absent, and a test pins that.
duration_markers:
  - "سنة"
  - "سنه"
  - "سنوات"
  - "سنين"
  - "السنة"
  - "السنه"
  - "شهر"
  - "شهرا"
  - "شهراً"
  - "شهور"
  - "أشهر"
  - "اشهر"
  - "الشهر"
  - year
  - years
  - month
  - months

# ─────────────────────────────────────────────────────────────
# Year heuristic. A bare 4-digit number in this range is a date, not a fee —
# unless it carries a currency marker, a unit multiplier or a percent sign.
# ─────────────────────────────────────────────────────────────
year:
  min: 1900
  max: 2100
  digit_length: 4
  markers:
    - "عام"
    - "لعام"
    - "سنة"
    - "سنه"
    - "السنة"
    - "السنه"
    - "عام دراسي"
    - year

# ─────────────────────────────────────────────────────────────
# Script detection, for the expected_lang check (harness spec §5.1). Ranges are
# inclusive hex codepoint bounds. A reply is attributed to the language holding
# the majority of its letters, so an Arabic reply keeping English technical
# terms — natural Egyptian usage — still reads as Arabic.
# ─────────────────────────────────────────────────────────────
scripts:
  ar:
    ranges:
      - [0x0600, 0x06FF]   # Arabic
      - [0x0750, 0x077F]   # Arabic Supplement
      - [0xFB50, 0xFDFF]   # Presentation Forms-A
      - [0xFE70, 0xFEFF]   # Presentation Forms-B
  en:
    ranges:
      - [0x0041, 0x005A]   # A-Z
      - [0x0061, 0x007A]   # a-z

# Phrases that qualify a figure in time, for the as_of disclosure check (§3.2).
# A reply carrying one of these discloses staleness even without a literal date.
temporal_qualifiers:
  - "حتى تاريخ"
  - "حتى تاريخه"
  - "آخر تحديث"
  - "اخر تحديث"
  - "بتاريخ"
  - "الأسعار سارية حتى"
  - as of
  - last updated
  - current as of

# ─────────────────────────────────────────────────────────────
# Franco-arab transliteration (§8.1). The keys matter twice over here: a digit
# glued to Latin letters is a consonant, not a number — "el 5ames" is الخامس,
# while "5 melion" is five million.
# ─────────────────────────────────────────────────────────────
franco_transliteration:
  "2": "ء"
  "3": "ع"
  "4": "ذ"
  "5": "خ"
  "6": "ط"
  "7": "ح"
  "8": "غ"
  "9": "ص"

# ─────────────────────────────────────────────────────────────
# Franco-Arab function words — the grammatical skeleton of Arabic typed on a
# Latin keyboard.
#
# The digit-substitution rule above catches `3ayez` and `sha22a`, and misses
# franco that happens to contain none of ع ح خ ء — which is roughly a third of
# it. `fe manh fe kantara?` has no substituted digit anywhere, and edu-0015
# was answered in English because of that.
#
# A word list is what cost us eighty-four compounds, and this one is
# defensible where that one was not: function words are a CLOSED set. Place
# names grow every time a tenant loads inventory; `fe`, `ana`, `msh` and
# `ezay` do not, and forty entries is most of the language's connective
# tissue.
#
# Two hits minimum, always. One `fe` or one `el` inside an English sentence is
# a coincidence; franco carries its skeleton throughout.
# ─────────────────────────────────────────────────────────────
franco_markers:
  - "ana"
  - "enta"
  - "enti"
  - "e7na"
  - "howa"
  - "heya"
  - "fe"
  - "fi"
  - "fee"
  - "men"
  - "3ala"
  - "3and"
  - "3andokom"
  - "3andak"
  - "3ayez"
  - "3awez"
  - "ayez"
  - "awez"
  - "3aiza"
  - "msh"
  - "mesh"
  - "mish"
  - "wala"
  - "aywa"
  - "la2"
  - "kam"
  - "bekam"
  - "ezay"
  - "ezayy"
  - "feen"
  - "fein"
  - "emta"
  - "leh"
  - "eh"
  - "da"
  - "di"
  - "dol"
  - "bta3"
  - "beta3"
  - "3ashan"
  - "3shan"
  - "momken"
  - "mumken"
  - "lw"
  - "law"
  - "kda"
  - "keda"
  - "shwaya"
  - "khalas"
  - "5alas"
  - "tany"
  - "kaman"
  - "mawgod"
  - "mawgoud"
