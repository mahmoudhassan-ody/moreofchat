# Property type surface forms to canonical types.
#
# Source: the running MoreofChat bot (resolve.ts:47-73, locations.ts:72-83,
# agent.ts:68-76), transcribed 2026-08-17.
#
# Canonical values match the catalogue's `property_type` column exactly, so a
# resolved type is usable as a filter without a second mapping.
#
# `studio` and `penthouse` became canonical on 2026-08-18, when the broker
# fixture gained 8 studios and 6 penthouses. They previously collapsed into
# `apartment` because the catalogue held no finer type, which meant a customer
# asking for a studio and shown a 3-bedroom apartment had been answered with
# the wrong thing while the type filter reported a match. Leaving the mapping
# lossy now would be worse than before: the 14 units exist and would be
# unreachable by the only queries that name them.
#
# `flat` stays under `apartment` — it is a synonym, not a tier.
#
# This changes config_hash, and it should: a run measured under a two-type
# residential taxonomy is not comparable to one measured under three.

version: 1

# What to call each type when a reply names it. Every label here is a form
# already listed under `types` below — transcribed from the running bot, not
# invented — because a reply that uses a word the matcher does not recognise
# cannot be parsed back by the customer's next message.
#
# Singular, because these render into "no <type> in <compound>", which is about
# a category rather than a count.
display:
  apartment:  {masri: 'شقة',      msa: 'شقة',      english: 'apartment'}
  studio:     {masri: 'استوديو',  msa: 'استوديو',  english: 'studio'}
  penthouse:  {masri: 'بنتهاوس',  msa: 'بنتهاوس',  english: 'penthouse'}
  villa:      {masri: 'فيلا',     msa: 'فيلا',     english: 'villa'}
  townhouse:  {masri: 'تاونهاوس', msa: 'تاونهاوس', english: 'townhouse'}
  duplex:     {masri: 'دوبلكس',   msa: 'دوبلكس',   english: 'duplex'}
  chalet:     {masri: 'شاليه',    msa: 'شاليه',    english: 'chalet'}
  office:     {masri: 'مكتب',     msa: 'مكتب',     english: 'office'}
  retail:     {masri: 'محل',      msa: 'محل',      english: 'retail unit'}

canonical:
  - apartment
  - studio
  - penthouse
  - villa
  - townhouse
  - duplex
  - chalet
  - office
  - retail

types:
  apartment:
    latin:
      - 'apartment'
      - 'apartments'
      - 'flat'
      - 'flats'
    arabic:
      - 'شقة'
      - 'شقه'
      - 'شقق'
      - 'شقتين'

  studio:
    latin:
      - 'studio'
      - 'studios'
    arabic:
      - 'استوديو'
      - 'ستوديو'

  penthouse:
    latin:
      - 'penthouse'
      - 'penthouses'
    arabic:
      - 'بنتهاوس'

  villa:
    latin:
      - 'villa'
      - 'villas'
    arabic:
      - 'فيلا'
      - 'ڤيلا'
      - 'فيلات'
      - 'ڤيلات'
      - 'فيلل'
      - 'ڤيلل'

  townhouse:
    latin:
      - 'townhouse'
      - 'townhouses'
    arabic:
      - 'تاونهاوس'
      - 'تاون هاوس'
      - 'تاون'

  duplex:
    latin:
      - 'duplex'
      - 'duplexes'
    arabic:
      - 'دوبلكس'
      - 'دوبلكسات'

  chalet:
    latin:
      - 'chalet'
      - 'chalets'
    arabic:
      - 'شاليه'
      - 'شاليهات'

  office:
    latin:
      - 'office'
      - 'offices'
    arabic:
      - 'مكتب'
      - 'مكاتب'

  retail:
    latin:
      - 'retail'
      - 'retails'
      - 'shop'
      - 'shops'
      - 'store'
      - 'stores'
      - 'mall'
      - 'commercial'
    arabic:
      - 'محل'
      - 'محلات'
      - 'متجر'
      - 'متاجر'
      - 'بوتيك'
      - 'تجاري'
      - 'تجارية'

# `شقتين` means "two apartments" or "two-bedroom" depending on context. It is
# listed under apartment because that is how the source bot treats it, but a
# turn resolving it should also consider bedrooms=2 — a customer writing
# "شقتين غرفتين" wants one two-bedroom flat, not two flats.
notes:
  ambiguous_forms:
    - form: 'شقتين'
      resolves_to: apartment
      also_consider: 'bedrooms=2'
