# Location aliases — the Arabic and franco names customers type.
#
# **This file is an overlay, not a catalogue.** The values a slot may hold come
# from `InventoryRepository.vocabulary()`, read off the `city` and `compound`
# columns of the tenant's own inventory. Which column a value sits in is its
# kind, so there is no `kind:` map here any more.
#
# It used to declare the vocabulary as well, and it declared ten of the
# catalogue's ninety-four compounds. That did not present as a missing alias.
# Asked about `كريك تاون` — Creek Town, three units in the fixture, one of them
# the sold unit re-0010 exists to test — the model picked the nearest value it
# was permitted to emit and answered with a Jefaira townhouse. A real compound,
# the wrong one, and `invented_compound_rate` read 0.0% throughout because
# Jefaira exists. `wrong_compound_rate` is the gate added for it.
#
# Keys are the catalogue's own spelling, exactly: `SouthMED`, not `Southmed`.
# The previous design derived a display name by title-casing a lower-case key,
# which cannot produce `SouthMED`, `Stei8ht`, `HAPTown` or `L'Avenir`, and a
# resolved slot is used as a filter directly. A key that is not a catalogue
# value is caught by tests/arabic/test_location_coverage.py.
#
# CORRECTED ON IMPORT (2026-08-17): the source had `العLMين` with Latin `LM`
# spliced into Arabic. Every Arabic El Alamein query missed, and it presented
# as the bot not covering Alamein. Now `العلمين`.
#
# Arabic and Latin are separate lists because they need different matching:
# Latin is case-folded and word-boundary matched, Arabic runs after the
# normalizer (alef/ya/ta-marbuta folding), so `القنطره` and `القنطرة` both hit.
# Franco substitutions used throughout: 7=ح, 3=ع, 5=خ, 2=ء/ق.
#
# Compounds mostly need no entry: their catalogue names are already Latin and
# that is how they are typed. An entry earns its place by carrying a name the
# catalogue spelling does not — an Arabic form, or a franco one that is not
# the Latin name with the vowels moved.

version: 1

aliases:
  'Ain Sokhna':
    arabic:
      - 'العين السخنة'
      - 'عين السخنة'
      - 'عين سخنة'
      - 'السخنة'
    latin:
      - 'ain sokhna'
      - 'ain el sokhna'
      - 'ein sokhna'
      - 'sokhna'
