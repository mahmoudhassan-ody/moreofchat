      - 'el alamein'
      - 'alamein'
  # The two names that errored re-0001 and re-0016 live (2026-08-20). Almost
  # nobody writes "New Cairo" — `التجمع الخامس` is the everyday Arabic name and
  # `tagamo3 el 5ames` the everyday franco one, and neither is a translation of
  # the canonical value, so nothing can infer the mapping from the name alone.
  # This is the largest city in the catalogue.
  'new cairo':
    arabic:
      - 'التجمع الخامس'
      - 'القاهرة الجديدة'
      - 'التجمع'
      - 'تجمع خامس'
    latin:
      - 'fifth settlement'
      - '5th settlement'
      - 'new cairo fifth settlement'
      - 'tagamoa el khames'
      - 'tagamo3 el 5ames'
      - 'el tagamoa'
      - 'tagamoa'
  'new capital':
    arabic:
      - 'العاصمة الادارية'
      - 'العاصمة الإدارية'
      - 'العاصمة الجديدة'
    latin:
      - 'new administrative capital'
      - 'administrative capital'
      - 'new capital city'
      - 'el asema el edarya'
      - 'asema edarya'
  'new zayed':
    arabic:
      - 'نيو زايد'
      - 'زايد الجديدة'
    latin:
