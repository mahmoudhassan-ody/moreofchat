      - 'العين السخنة'
      - 'عين السخنة'
      - 'عين سخنة'
      - 'السخنة'
    latin:
      - 'ain sokhna'
      - 'ain el sokhna'
      - 'ein sokhna'
      - 'sokhna'
  'azha':
    arabic:
      - 'ازها'
    latin:
      - 'azha'
  'badya':
    arabic:
      - 'باديا'
    latin:
      - 'badya'
  'cairo':
    arabic:
      - 'القاهرة'
    latin:
      - 'cairo'
  'celian':
