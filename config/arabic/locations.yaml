# Location aliases — Arabic and Latin surface forms to canonical values.
#
# Source: the running MoreofChat real-estate bot (locations.ts:108-173),
# transcribed 2026-08-17. Canonical values match the `city` and `compound`
# columns in the catalogue, so a resolved alias can be used as a filter
# directly — every fixture city has coverage here.
#
# CORRECTED ON IMPORT: the source had `العLMين` and `العLMين الجديدة` with
# Latin `LM` spliced into Arabic. Every Arabic El Alamein query missed, and
# it presented as the bot not covering Alamein. Now `العلمين`.
#
# Arabic and Latin are separate lists because they need different matching:
# Latin is case-folded and word-boundary matched, Arabic runs after the
# normalizer (alef/ya/ta-marbuta folding), so `القنطره` and `القنطرة` both hit.
#
# SWEPT 2026-08-20, after `Tagamoa El Khames` errored a live case. Ten of the
# twenty-six canonical values carried no `latin:` list at all, which makes them
# unreachable to a franco customer — and `franco_or_misspelled` is an eval
# category (§4.2) because that is how Egyptians type. Every value now has both
# scripts, asserted in tests/arabic/test_location_coverage.py rather than
# eyeballed. Franco substitutions used throughout: 7=ح, 3=ع, 5=خ, 2=ء/ق.

version: 1

kind:
  # Which canonical values are cities vs compounds. A city filters `city`,
  # a compound filters `compound` — conflating them returns the wrong set.
  'ain sokhna': city
  'azha': compound
  'badya': compound
  'cairo': city
  'celian': compound
  'el gouna': compound
  'hyde park': compound
  'jefaira': compound
  'madinaty': compound
  'makadi heights': compound
  'marassi': compound
  'mivida': compound
  'mokattam': city
  'mostakbal city': city
  'new alamein': city
  'new cairo': city
  'new capital': city
  'new zayed': city
  'noor city': compound
  'north coast': city
  'october': city
  'red sea': city
  'sheikh zayed': city
  'southmed': compound
  'the ark': compound
  'west cairo': city

