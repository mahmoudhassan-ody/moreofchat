  'october':
    arabic:
      - 'السادس من أكتوبر'
      - 'مدينة السادس من أكتوبر'
      - 'أكتوبر'
    latin:
      - 'sixth of october'
      - '6 of october'
      - '6 october'
      - '6th of october'
      - 'october city'
  'red sea':
    arabic:
      - 'البحر الأحمر'
    latin:
      - 'red sea'
      - 'el ba7r el a7mar'
  # No bare `زايد` / `zayed`, deliberately. It is the commonest short form and
  # it is also inside `زايد الجديدة` (New Zayed), a different canonical value
  # filtering the same column. `_aliases()` resolves overlaps longest-first, so
  # a bare alias would only ever lose — but it would lose silently, and the two
  # cities have different stock.
  'sheikh zayed':
    arabic:
      - 'الشيخ زايد'
      - 'شيخ زايد'
    latin:
      - 'sheikh zayed'
      - 'el sheikh zayed'
  'southmed':
    arabic:
      - 'ساوث ميد'
    latin:
      - 'southmed'
  'the ark':
    arabic:
      - 'ذا ارك'
      - 'الارك'
      - 'الآرك'
      - 'ذا آرك'
    latin:
      - 'the ark'
  'west cairo':
    arabic:
      - 'غرب القاهرة'
      - 'القاهرة الغربية'
    latin:
      - 'west cairo'

anywhere_else:
  # "somewhere else" — the customer rejecting the area just offered. Must not
  # be parsed as a location name, or it becomes a search for a place called
  # "مكان تاني".
  latin:
    - 'any other project'
    - 'any other place'
    - 'any other location'
    - 'any other area'
    - 'any other compound'
    - 'anywhere else'
    - 'elsewhere'
    - 'other projects'
    - 'different project'
    - 'different place'
    - 'somewhere else'
  arabic:
    - 'في مكان تاني'
    - 'في مكان آخر'
    - 'مشروع تاني'
    - 'مشروع آخر'
    - 'أماكن تانية'
    - 'مكان تاني'
    - 'غير ده'
    - 'حاجة تانية'
    - 'أي مكان'
    - 'أي مشروع'
    - 'في أماكن أخرى'
    - 'مشاريع أخرى'

