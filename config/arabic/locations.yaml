anywhere_else:
  # "somewhere else" — the customer rejecting the area just offered. Must not
  # be parsed as a location name, or it becomes a search for a place called
  # "مكان تاني".
  latin:
    - 'any other project'
    - 'any other place'
    - 'any other location'
    - 'any other area'
    - 'any other compound'
    - 'anywhere else'
    - 'elsewhere'
    - 'other projects'
    - 'different project'
    - 'different place'
    - 'somewhere else'
  arabic:
    - 'في مكان تاني'
    - 'في مكان آخر'
    - 'مشروع تاني'
    - 'مشروع آخر'
