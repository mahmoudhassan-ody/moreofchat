# LLM routing — platform tier (design doc §19.1), mirroring §2.6's table.
#
# Task-level routing with cross-provider failover, never per-tenant provider
# choice: per-tenant doubles the eval matrix and makes every prompt two prompts
# to maintain.
#
# No model name appears in code. Changing a model is a config edit, which moves
# config_hash, which correctly invalidates comparison against a baseline
# measured on the old model (harness spec §2.3).
#
# Every model id below was resolved from the provider's /v1/models on
# 2026-08-17 and confirmed with a real billed completion, not just a 200 from
# the models endpoint. Re-check when repinning; ids drift faster than this file.
#
# OpenAI's 5.6 line names capability tiers rather than sizes: sol is the
# flagship, terra the balanced middle, luna the small/fast tier. That maps onto
# §2.6's "flagship" and "small/mini" rows directly, so gpt-5.5 and gpt-5.4-mini
# are retired from this file — sol matches gpt-5.5's price at higher capability,
# and luna undercuts gpt-5.4-mini roughly fourfold.

version: 1

# Anthropic accepts at most four cache_control breakpoints per request and
# returns a 400 beyond that. Retrieval routinely produces five passages
# (fusion's final_k), so this is not an edge case — it is every grounded turn.
# Blocks past the limit are still sent, just uncached: a cache miss costs
# money, a 400 costs the answer.
anthropic_cache_breakpoints: 4

http:
  # A hung provider must not hold a worker. Connect separately from read,
  # because a DNS or TLS stall and a slow generation are different faults.
  connect_timeout_seconds: 5
  read_timeout_seconds: 60
  # Retries are for transient faults only, and sit *below* the breaker in
  # router.py — a provider that is genuinely down should trip the circuit
  # rather than absorb three retries per call forever.
  max_retries: 2
  backoff_base_seconds: 0.5
  backoff_jitter_seconds: 0.25

breaker:
  # Consecutive failures against one provider before its circuit opens. Per
  # provider, not global: one vendor's incident must not stop the other.
  failure_threshold: 5
  reset_seconds: 60

# §2.5's budget, split so a regression is attributable. The model call is one
# segment of the turn; retrieval, guards and the channel hop share the rest.
latency_budget:
  # Measured, not estimated. The 4000 these replace was an unmeasured figure
  # carried from the design doc's first draft; the model call alone consumed
  # 109% of it at the median. §2.5 records the six samples.
  end_to_end_p95_ms: 7000
  # What one answer-composition call should take. Six samples from the
  # Frankfurt VPS with reasoning off and effort medium gave
  # min 2746 / median 4551 / max 5052 ms for a ~310-token Arabic answer.
  model_call_p95_ms: 5000
  # Breakage detector, not a target. Above this something is wrong — reasoning
  # switched back on, a provider incident, the wrong model pinned — rather than
  # merely slower than we want. Kept well clear of the measured spread so the
  # live suite fails on regressions instead of on network jitter.
  model_call_ceiling_ms: 8000

# ─────────────────────────────────────────────────────────────
# `reasoning` is the one control that must mean the same thing on both
# providers, because failover must not silently change how a turn is produced:
#
#   none  — Anthropic `thinking: {type: disabled}`, OpenAI `reasoning_effort: none`
#   auto  — Anthropic `thinking: {type: adaptive}`, OpenAI `reasoning_effort: <effort>`
#
# `effort` is passed through to the provider verbatim and is therefore
# provider-native — set it only to a value that model accepts. Notably
# claude-haiku-4-5 rejects the effort parameter outright with a 400, which is
# why its entries carry none.
# ─────────────────────────────────────────────────────────────

tasks:
  # §2.6: the one task that stays pinned by default. The primary is whichever
  # wins the Arabic eval suite (§8.3) — re-run that comparison quarterly rather
  # than assuming it. Do not repin from the 22 worked examples.
  #
  # reasoning: none. claude-sonnet-5 thinks by default, and this is the
  # user-facing latency path (§2.5). Composition is a bounded phrasing job —
  # §3.1 gives the LLM the words, never the facts — so there is nothing here
  # worth spending thinking tokens or seconds on.
  answer_composition:
    primary:
      provider: anthropic
      model: claude-sonnet-5
      reasoning: none
      effort: medium
    failover:
      provider: openai
      model: gpt-5.6-sol
      reasoning: none
      effort: medium
    # Raised from 1024: with thinking off a short grounded Arabic fee answer
    # measured ~330 output tokens, and a reply carrying an as_of disclosure and
    # a next step runs longer. Arabic also tokenizes less efficiently than
    # English. This is a ceiling, not a target — the cost is on tokens
    # generated, so headroom is free and truncation is not.
    max_tokens: 2048

  # Haiku carries no effort key: the parameter is a 400 on this model.
  slot_extraction:
    primary:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      reasoning: none
    failover:
      provider: openai
      model: gpt-5.6-luna
      reasoning: none
    max_tokens: 512

  query_rewriting:
    primary:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      reasoning: none
    failover:
      provider: openai
      model: gpt-5.6-luna
      reasoning: none
    max_tokens: 256

  # Offline, so latency does not matter and quality does — the one task that
  # keeps reasoning on. A judge that grades grounding and register without
  # thinking is a judge whose disagreements nobody can defend.
  eval_grading:
    primary:
      provider: anthropic
      model: claude-opus-5
      reasoning: auto
      effort: high
    failover:
      provider: openai
      model: gpt-5.6-sol
      reasoning: auto
      effort: high
    max_tokens: 2048

  # failover: null is a rule, not an omission (§7.3). Vectors are comparable
  # only within one model and dimension count, so a fallback provider would
  # return a different space and retrieval quality would collapse without
  # anything raising. If this endpoint is down the correct behaviour is that
  # ingest queues and search degrades to Meilisearch-only.
  #
  # 1024 via Matryoshka truncation: roughly a third of the Qdrant storage of
  # 3072, with minimal quality loss. Changing it is a full re-embed.
  embedding:
    primary:
      provider: openai
      model: text-embedding-3-large
      dimensions: 1024
    failover: null
