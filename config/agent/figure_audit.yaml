# Claim-level figure grounding — §19.3 and harness §2.1.1.
#
# The second half of the figure guarantee. `check_numeric_grounding` asks
# whether a number appeared in the retrieved set; this asks whether the
# material says that number is what the reply says it is. edu-0002 is why:
# the reply gave the 2000 EGP application fee correctly and then offered 1000
# — a figure from an adjacent passage — as a second application fee, and the
# deterministic check passed it because 1000 was in the set.
#
# **There is no `enabled` flag and there must not be one.** §19.3 makes the
# threshold tunable and the gate a product guarantee; a switch here would be a
# switch for turning the guarantee off. What is configurable is the prompt and
# the routing, which is where the cost and the model choice live.
#
# Cost, measured 2026-08-20 on claude-haiku-4-5 over 12 audits: median 940 ms,
# min 793, max 2057; 281 input and 82 output tokens; $0.00069 per audited turn.
# It runs only on a composed reply that states a figure — roughly 12 of 19
# turns in the education suite.

version: 1

prompt: figure_audit_v1
