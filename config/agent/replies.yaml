# Scripted replies — the turns no model composes (design §2.6, §3.1, §19.3).
#
# Every string here is sent when the model either could not be asked or must
# not be trusted. That makes this file the customer-facing surface of every
# failure mode in the system, which is why it is config a tenant's own people
# can read and edit rather than strings buried in a Python module.
#
# Register is chosen by the node, not mirrored from the customer (§8.2), and
# these carry all three so a turn does not switch language on its way to an
# apology. `masri` is the fallback when a key has no entry for the node's
# register: an outage message is conversation, not regulation.
#
# House rules for anything added here:
#   - No figure, ever. A scripted reply is what we send *because* we could not
#     ground one, so a number in this file is a hallucination with a version
#     control history.
#   - Name the next step. "Something went wrong" leaves the customer with
#     nothing to do; "a colleague will follow up" is an outcome they can wait
#     for.
#   - No apology theatre. One sentence acknowledging it, one saying what
#     happens next.

version: 1

replies:
  # The script's node says this turn is refused. Distinct from `clarify`, which
  # asks the customer to say more — here the question was perfectly clear and
  # the answer is that we will not. Distinct from `handoff` too: a colleague
  # cannot project a return either, and passing it along implies someone here
  # will.
  #
  # Says what *is* knowable, because a refusal that offers nothing reads as
  # evasion rather than as a limit — and that second half is a property of the
  # node doing the refusing, which is why these are keyed by node.
  #
  # **This was one string for both verticals and it was written for one of
  # them.** edu-0017 asks which faculty leads to a job, is correctly refused,
  # and told "أقدر أقولك السعر الحالي وخطة السداد المتاحة" — a price and a
  # payment plan, to a student. `default` exists so a new refuse node is never
  # a KeyError in front of a customer; a test asserts every shipped refuse node
  # has its own entry, so it is also never silently another vertical's offer.
  refuse:
    default:
      masri: "مش هينفع أساعد في ده، بس قوللي محتاج تعرف إيه تاني وأنا تحت أمرك."
      msa: "لا يمكننا الإفادة في هذا الشأن. يسعدنا مساعدتك في أي استفسار آخر."
      english: "I can't help with that one, but tell me what else you need and I'll help."

    # re-0015. Every number in a projection would be invented, and it is also
    # the kind of claim that attracts regulatory attention.
    investment_projection:
      masri: "مش هينفع أتوقّعلك ده، بس أقدر أقولك السعر الحالي وخطة السداد المتاحة."
      msa: "لا يمكننا تقديم توقعات بهذا الشأن. يمكننا إفادتك بالسعر الحالي وخطة السداد المتاحة."
      english: "I can't forecast that, but I can tell you the current price and the payment plan."

    # edu-0017. The forbidden claims rule out a ranking and an employment rate,
    # so what is left to offer is the thing the KB actually holds: which
    # faculties exist and what each one asks for.
    career_advice:
      masri: "مش هينفع أرشحلك كلية معينة، بس أقدر أقولك الكليات المتاحة والحد الأدنى للقبول في كل واحدة."
      msa: "لا يمكننا ترشيح كلية بعينها. يمكننا إفادتك بالكليات المتاحة والحد الأدنى للقبول لكل منها."
      english: "I can't recommend a particular faculty, but I can tell you which faculties there are and the minimum grade each one asks for."

  # The script routed the turn to a human — a handoff node, an explicit
  # request, or three failed clarifications (§9).
  handoff:
    masri: "لحظة واحدة من فضلك، هحوّلك لزميلي وهيرد عليك حالًا."
    msa: "لحظة من فضلك، سيتم تحويلك إلى أحد الزملاء للرد على استفسارك."
    english: "One moment please — I'm passing you to a colleague who'll follow up."

  # The engine has no node for this message, or the customer's meaning is
  # ambiguous. Ask, never guess (§3.1).
  clarify:
    masri: "ممكن توضّحلي أكتر عايز تعرف إيه بالظبط؟"
    msa: "هل يمكنك توضيح استفسارك بشكل أدق؟"
    english: "Could you tell me a bit more about what you need?"

  # Retrieval came back below the confidence threshold (§7.5). Deliberately
  # does not say "I don't know" — it says what would help, because the usual
  # cause is a question missing the one detail that would find the answer.
  low_confidence:
    masri: "معلش، مش لاقي معلومة مؤكدة عن ده. ممكن تقوللي الكلية أو القسم عشان أوصلك للإجابة الصح؟"
    msa: "لا تتوفر لدي معلومة مؤكدة بخصوص هذا الاستفسار. يرجى تحديد الكلية أو القسم."
    english: "I don't have a confirmed answer for that. Which faculty or department do you mean?"

  # The model composed a figure that traced to nothing, or hedged one that did
  # (§19.3). The customer is never told this happened — they get a human, which
  # is the correct outcome and the only honest one.
  grounding_failed:
    masri: "عايز أتأكد من الرقم ده قبل ما أبعتهولك. هحوّلك لزميلي يأكدلك عليه."
    msa: "يلزم التحقق من هذه البيانات قبل إفادتك بها. سيتم تحويلك إلى أحد الزملاء لتأكيدها."
    english: "I want to confirm that figure before I give it to you — passing you to a colleague."

  # Every provider is failing or breaker-open (§2.6). Never an error, never a
  # retry prompt: the customer did nothing wrong and cannot fix it.
  provider_unavailable:
    masri: "فيه مشكلة تقنية بسيطة عندنا دلوقتي. هحوّلك لزميلي عشان يساعدك."
    msa: "نواجه عطلًا تقنيًا مؤقتًا. سيتم تحويلك إلى أحد الزملاء لمساعدتك."
    english: "We're having a brief technical problem — passing you to a colleague."

  # ── real-estate search results ────────────────────────────────────────
  #
  # The type the customer asked for is never substituted. A chalet request is
  # not answered with a townhouse, an office request not with retail. The
  # closest-priced unit of another type is the wrong answer wearing the right
  # price, and the customer discovers it after the viewing.
  #
  # A different *compound* is a legitimate alternative and the point of the
  # first shape below; a different *type* never is. Both compounds are named
  # so the customer can tell what moved — "we have one nearby" hides the swap.
  #
  # Every compound named here comes from the catalogue. An invented compound is
  # the same class of failure as an invented price, and it is caught by the
  # same gate.
  no_match_in_compound:
    masri: "مفيش {type} في {asked} دلوقتي. عندنا {type} في {offered} لو تحب أبعتلك التفاصيل."
    msa: "لا تتوفر {type} في {asked} حاليًا. تتوفر {type} في {offered}."
    english: "No {type} in {asked} right now. We do have a {type} in {offered}."

  # Nothing of that type anywhere in range. Said plainly, then handed over —
  # this is the turn where offering something else is most tempting and most
  # wrong.
  no_match_anywhere:
    masri: "مفيش {type} متاح في النطاق ده حاليًا. هحوّلك لزميلي يشوف إيه الموجود."
    msa: "لا تتوفر {type} ضمن النطاق المطلوب حاليًا. سيتم تحويلك إلى أحد الزملاء."
    english: "There's no {type} available in that range right now — passing you to a colleague."

# Several slots missing at once. One question per slot would be an
# interrogation, and the generic "what exactly do you need?" is what the judge
# kept failing: "طلب التوضيح عام، ولم يحدد أن المطلوب هو معرفة الفرع ونوع
# الشهادة" — a clarification that does not name the missing thing makes the
# customer guess twice, and they usually guess wrong.
#
# Nouns rather than questions, joined into one sentence. `admission_thresholds`
# needs three of these at once.
ask_for_slots:
  template:
    masri: "عشان أعرف أجاوبك صح، محتاج أعرف {items}."
    msa: "لتقديم الإفادة الصحيحة، يرجى تحديد {items}."
    english: "To answer that accurately I need to know {items}."
  join:
    masri: " و"
    msa: " و"
    english: " and "
  nouns:
    faculty:
      masri: "الكلية"
      msa: "الكلية"
      english: "the faculty"
    branch:
      masri: "الفرع"
      msa: "الفرع"
      english: "the branch"
    certificate:
      masri: "نوع الشهادة"
      msa: "نوع الشهادة"
      english: "the certificate type"
    student_status:
      masri: "إنت طالب مصري ولا دولي"
      msa: "ما إذا كان الطالب مصريًا أم دوليًا"
      english: "whether the student is Egyptian or international"

# edu-0009. The fallback node has no missing slots to name — the customer's
# message routed nowhere, which is a different problem from an incomplete
# question — so `ask_for_slots` cannot reach it and "ممكن توضّحلي أكتر" was all
# it could say. To a customer who had already asked clearly: "المواعيد إيه؟",
# which could be branch hours, bus times or an application deadline.
#
# The options are the *titles of the retrieved passages*, unedited. In a Q&A
# corpus a title is one of the meanings the question might have had, and using
# them keeps the clarification grounded in the same sense a reply is: an option
# the KB cannot answer is never offered, because it was never retrieved. It
# also means no per-tenant list to maintain and drift.
#
# Titles are quoted as the tenant wrote them, in whatever language they wrote
# them. Only the sentence around them mirrors the customer.
clarify_options:
  # Below two, this does not fire — a list of one is a guess with a question
  # mark on it, not a choice. Above the cap it is a wall nobody answers;
  # retrieval returns final_k passages and offering all of them is a browse.
  min: 2
  max: 3
  template:
    masri: "تقصد أنهي واحدة فيهم؟ عندي:\n{items}"
    msa: "ما المقصود تحديدًا؟ المتاح لدينا:\n{items}"
    english: "Which do you mean? I have:\n{items}"
  # One per line rather than a joined sentence: these are whole questions, and
  # "أ و ب و ج" made of three questions is unreadable. No markdown bullet —
  # WhatsApp renders none of it (§ channel formatting).
  bullet: "- "


# Slot questions, keyed by the slot the script asked for. Masri by default:
# asking which faculty is conversation, even when the answer will be regulation.
ask_for_slot:
  faculty:
    masri: "حضرتك بتسأل عن أنهي كلية؟"
    msa: "عن أي كلية تستفسر؟"
    english: "Which faculty are you asking about?"

  # re-0009's clarification. Never "which unit id" — a customer does not know
  # one and asking for it reads as a form. The compound and the type are what
  # they said in the first place.
  unit_id:
    masri: "بتسأل عن أنهي وحدة بالظبط؟ قوللي الكمبوند و نوع الوحدة و هجيبلك التفاصيل."
    msa: "عن أي وحدة تستفسر؟ يرجى تحديد الكمبوند ونوع الوحدة."
    english: "Which unit do you mean? Tell me the compound and the unit type and I'll pull the details."

  branch:
    masri: "حضرتك بتسأل عن أنهي فرع، العريش ولا القنطرة؟"
    msa: "عن أي فرع تستفسر، العريش أم القنطرة؟"
    english: "Which branch are you asking about — Arish or Qantara?"

  certificate:
    masri: "شهادة إيه؟ ثانوية عامة، أزهرية، ولا شهادة معادلة؟"
    msa: "ما نوع الشهادة: الثانوية العامة، الأزهرية، أم شهادة معادلة؟"
    english: "Which certificate — general secondary, Azhari, or an equivalent?"

  student_status:
    masri: "حضرتك طالب مصري ولا دولي؟ المطلوب بيختلف."
    msa: "هل الطالب مصري أم دولي؟ تختلف المستندات المطلوبة."
    english: "Is the student Egyptian or international? The documents differ."

  # A browse question that narrowed nothing — see `requires_any_slot`.
  property_type:
    masri: "بتدوّر على إيه بالظبط؟ شقة، فيلا، استوديو؟ و في أنهي منطقة؟"
    msa: "ما نوع الوحدة المطلوبة، وفي أي منطقة؟"
    english: "What are you looking for — an apartment, a villa, a studio? And in which area?"
