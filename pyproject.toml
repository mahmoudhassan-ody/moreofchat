[project]
name = "moc"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "redis",
  "pyyaml",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "testcontainers[postgres]",
  "import-linter",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "eval: Arabic evaluation suite — runs against the shipped case corpus",
  "live: hits real provider APIs; costs money. Opt-in via -m live, excluded from CI",
]
# --strict-markers: an unregistered @pytest.mark.typo is an error rather than a
# marker nothing will ever select. The companion guarantee is separate — pytest
# exits 5 when `-m eval` matches no tests, so the CI eval jobs cannot pass by
# collecting nothing.
#
# `-m "not live"`: live tests hit real providers and cost money, so they are off
# by default everywhere including CI. A command-line `-m live` comes after this
# and wins, which is the only way to run them.
addopts = "--strict-markers -m 'not live'"
