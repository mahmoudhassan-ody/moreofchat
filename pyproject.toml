[project]
name = "moc"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "redis",
  "pyyaml",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "testcontainers[postgres]",
  "import-linter",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["eval: Arabic evaluation suite (slow)"]
