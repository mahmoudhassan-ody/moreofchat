name: moc
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: moc_dev
      POSTGRES_PASSWORD: ${MOC_PG_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9
    command: valkey-server --save 60 1 --requirepass ${MOC_VALKEY_PASSWORD}
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__API_KEY: ${MOC_QDRANT_KEY}
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MOC_MEILI_KEY}
      MEILI_ENV: production
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meili:/meili_data"]
    restart: unless-stopped

  # ── the application, added in Task 39 ────────────────────────────────────
  #
  # Three services from one image. Inside the compose network the backing
  # stores are reachable by service name, not on 127.0.0.1 — the host values in
  # `.env` are for processes running on the host, and a container inheriting
  # them would resolve 127.0.0.1 to itself and report the database as down.

  api:
    build: .
    command:
      - uvicorn
      - --factory
      - moc.api.main:webhook_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file: [.env]
    environment: &in_network
      MOC_PG_HOST: postgres
      MOC_VALKEY_HOST: valkey
      MOC_QDRANT_HOST: qdrant
      MOC_MEILI_HOST: meilisearch
    # Loopback only. Caddy reaches it over the compose network by name; this
    # publish exists so the drive script and a human with SSH can reach it.
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
    restart: unless-stopped

  console:
    build: .
    command:
      - uvicorn
      - --factory
      - moc.api.main:console_app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    env_file: [.env]
    environment: *in_network
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
    restart: unless-stopped

  worker-inbound:
    build: .
    command: ["python", "-m", "moc.workers.run", "inbound"]
    env_file: [.env]
    environment: *in_network
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
    restart: unless-stopped

  worker-outbound:
    build: .
    command: ["python", "-m", "moc.workers.run", "outbound"]
    env_file: [.env]
    environment: *in_network
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
    restart: unless-stopped

  # The one service that publishes outside loopback, and the only one. See the
  # Caddyfile for why the rule is narrowed here rather than broken.
  caddy:
    image: caddy:2
    ports: ["0.0.0.0:80:80", "0.0.0.0:443:443"]
    environment:
      # `localhost` by default so `docker compose up` works on a laptop with
      # Caddy's internal CA. A real deployment sets the hostname the vendor
      # will call, and Caddy gets a public certificate for it.
      MOC_DOMAIN: ${MOC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The built console. `npm run build` first — Caddy serves files, it does
      # not compile them, and an unbuilt `dist` is a 404 that looks like a
      # routing problem.
      - ./console/dist:/srv/console:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, console]
    restart: unless-stopped

volumes:
  pgdata:
  qdrant:
  meili:
  caddy_data:
  caddy_config:
